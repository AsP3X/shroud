# Nginx Proxy Manager overlay: no host ports. API + web join the external proxy-network.
#
#   docker network create proxy-network   # once, if NPM has not already
#   docker compose -f docker-compose.yml -f docker-compose.npm.yml up -d --build
#
# NPM proxy hosts:
#   web  → http://shroud-web:80     (the operator console is https://<that host>/admin)
#   api  → http://shroud-api:8080   (iOS and any client that does not go through the web nginx)
#
# NPM writes an access log per proxy host with each client's address and user agent. Matched by
# time with the API's own log, that ties people to addresses. In each host's Advanced tab, add:
#   access_log off;

#
# NPM's address on proxy-network is not known in advance, so api and web trust the networks they
# are on (TRUST_PROXY_NETWORKS). That is safe only because this overlay publishes no port: only
# containers on proxy-network and shroud-internal reach them.
#
# The API's operator listener (OPERATOR_PORT) binds its shroud-internal address only, so no
# container on proxy-network reaches it (docker-compose.yml, OPERATOR_HOST).

services:
  api:
    environment:
      TRUST_PROXY_NETWORKS: "true"
    networks:
      - shroud-internal
      - proxy-network

  web:
    environment:
      TRUST_PROXY_NETWORKS: "true"
    networks:
      - shroud-internal
      - proxy-network

networks:
  proxy-network:
    name: proxy-network
    external: true
