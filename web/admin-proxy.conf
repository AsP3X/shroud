# Proxy to the admin console without the web client's security headers (one add_header
# here stops nginx from inheriting them) and without the caller's address.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
# An empty value drops the header. The console logs no client address.
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Real-IP "";
proxy_set_header Forwarded "";
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
add_header X-Content-Type-Options "nosniff" always;
