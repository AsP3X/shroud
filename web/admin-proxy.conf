# Proxy to the admin console without the web client's security headers (one add_header
# here stops nginx from inheriting them).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
# An empty value drops the header. The console logs no client address; it keys sign-in
# failures on X-Real-IP in memory, so nobody elsewhere can lock an operator out.
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Forwarded "";
proxy_connect_timeout 5s;
# The console takes request bodies of 16 KiB at most (admin/api/src/lib.rs BODY_LIMIT). Anything
# far past that is refused here with 413, before nginx spools it into its temp tmpfs, instead of
# the site-wide MAX_UPLOAD_BYTES that media uploads need.
client_max_body_size 64k;
proxy_read_timeout 60s;
add_header X-Content-Type-Options "nosniff" always;
# This block's own add_header drops the site's; keep HSTS for the console too.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
