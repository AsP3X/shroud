# Lives in http {} (conf.d). Not run through envsubst.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Operator sign-in attempts (POST to /api/admin/session and its recovery and reauth paths),
# per client: Argon2 runs on each, and the console's own limiter counts only failures. Other
# methods have an empty key, which limit_req does not count.
map $request_method $admin_sign_in_client {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $admin_sign_in_client zone=admin_sign_in:1m rate=20r/m;

# script-src of the web client's CSP. Worker scripts (hashed, under /assets/) may import a blob:
# module: transformers.js loads the ONNX runtime's factory that way in the Whisper worker. Pages
# may not, so a blob: document opened from the app (a received photo in a new tab) runs no script.
# A CSP on a script the page itself loads is ignored; only documents and workers apply theirs.
map $uri $shroud_script_src {
    ~^/assets/.+\.m?js$ "'self' 'wasm-unsafe-eval' blob:";
    default             "'self' 'wasm-unsafe-eval'";
}
