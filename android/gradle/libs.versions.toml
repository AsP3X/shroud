# Every dependency of the Android port (00-plan §5.1), added up front by W0-A so feature packages
# never edit Gradle files. Versions checked 2026-10-01 (latest stable on Maven Central / Google Maven).
#
# No Firebase, Play services, ML Kit, Tink, Play Core, install referrer or analytics SDKs —
# `verifyNoGoogleServices` fails the build otherwise. The UnifiedPush embedded FCM distributor
# is allowed: it ships no Google code and only wakes the app through Play Services when that
# package is installed. ZXing, AndroidX, CameraX, Media3 and the WebRTC AAR run locally.
# No `androidx.compose.material*` either (`verifyNoMaterial`).

[versions]
agp = "9.4.1"
kotlin = "2.4.20"
coroutines = "1.11.0"
serialization = "1.11.0"
okhttp = "5.5.0"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.2"        # unused (the shell runs its own stacks); W4-RELEASE removes it if still unused
coreKtx = "1.19.1"
datastore = "1.2.1"          # unused (SharedPreferences); W4-RELEASE removes it if still unused
bouncycastle = "1.86"
haze = "2.0.1"
browser = "1.10.0"
emoji2 = "1.7.0"
camerax = "1.6.2"
media3 = "1.11.1"
exifinterface = "1.4.2"
ink = "1.0.0"
zxing = "3.5.4"
webrtc = "150.7871.01"
coreTelecom = "1.0.1"
work = "2.12.0"
unifiedpushEmbeddedFcm = "3.1.0"
junit = "4.13.2"
icu4j = "78.3"
turbine = "1.2.1"
robolectric = "4.17"
androidxTest = "1.7.0"
androidxTestExtJunit = "1.3.0"
uiautomator = "2.4.0"
# Compose ui-test pulls espresso-core 3.5.0, whose reflective InputManager.getInstance() is gone on API 37.
espresso = "3.7.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-animation = { module = "androidx.compose.animation:animation" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }

# W1-UI-THEME: backdrop blur on API 31+ (C42).
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
haze-blur = { module = "dev.chrisbanes.haze:haze-blur", version.ref = "haze" }
# W2-LINKS: Custom Tabs (the user's own browser).
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
# W3-THREAD-BUBBLES: bundled emoji font for API 30–32; the GMS font-provider initializer is removed in the manifest.
androidx-emoji2-bundled = { module = "androidx.emoji2:emoji2-bundled", version.ref = "emoji2" }
# W3-MEDIA-VIEW, W3-CONTACTS-UI: in-app camera and the QR scanner.
camerax-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camerax-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camerax-video = { module = "androidx.camera:camera-video", version.ref = "camerax" }
camerax-compose = { module = "androidx.camera:camera-compose", version.ref = "camerax" }
# W2-VIDEO, W2-VOICE, W3-MEDIA-VIEW: playback through SealedMediaDataSource, transcoding.
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui-compose = { module = "androidx.media3:media3-ui-compose", version.ref = "media3" }
media3-transformer = { module = "androidx.media3:media3-transformer", version.ref = "media3" }
media3-effect = { module = "androidx.media3:media3-effect", version.ref = "media3" }
media3-muxer = { module = "androidx.media3:media3-muxer", version.ref = "media3" }
# W2-MEDIA-IMAGE: orientation, minimal EXIF.
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
# W3-MEDIA-EDIT: the draw editor.
ink-authoring-compose = { module = "androidx.ink:ink-authoring-compose", version.ref = "ink" }
ink-brush = { module = "androidx.ink:ink-brush", version.ref = "ink" }
ink-strokes = { module = "androidx.ink:ink-strokes", version.ref = "ink" }
ink-geometry = { module = "androidx.ink:ink-geometry", version.ref = "ink" }
ink-rendering = { module = "androidx.ink:ink-rendering", version.ref = "ink" }
# W2-CONTACTS, W3-CONTACTS-UI: QR encode/decode, pure Java, no network.
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
# W3-CALLS-MEDIA: native WebRTC M150 (P16b).
webrtc = { module = "io.github.webrtc-sdk:android", version.ref = "webrtc" }
# W3-CALLS-SYSTEM: self-managed calls.
androidx-core-telecom = { module = "androidx.core:core-telecom", version.ref = "coreTelecom" }
# W3-PUSH: expedited device-removal worker.
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
# Delivery: UnifiedPush's embedded FCM distributor. No Play Services SDK; degoogled phones
# never register it because Play Services is absent.
unifiedpush-embedded-fcm = { module = "org.unifiedpush.android:embedded-fcm-distributor", version.ref = "unifiedpushEmbeddedFcm" }

junit = { module = "junit:junit", version.ref = "junit" }
icu4j = { module = "com.ibm.icu:icu4j", version.ref = "icu4j" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTest" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTest" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
