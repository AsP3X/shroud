# Gradle daemon JVM criteria (decision W0-A, 2026-10-01): the daemon — which runs AGP, D8/R8 and
# the Kotlin compiler — uses JDK 21, the same JDK as `kotlin { jvmToolchain(21) }`, so every
# machine and CI produce the same build (F-Droid reproducibility, W4-RELEASE). No download URLs:
# Gradle picks a locally installed JDK 21 and never fetches one from a third party at build time.
toolchainVersion=21
