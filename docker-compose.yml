# Full stack: Postgres, Redis, Nebular OS, shroud-server API, the web client,
# and (with --profile admin) the admin console.
# Agent: READS .env; WRITES volumes. Public entry is either host ports (local overlay)
#        or Nginx Proxy Manager (npm overlay) — see ./deploy.sh.
#
#   ./deploy.sh                         wizard on first run, then up
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.npm.yml up -d --build
#
# NPM targets (npm overlay, container DNS on proxy-network):
#   http://shroud-web:80     → web client (also reverse-proxies /api/v1)
#   http://shroud-api:8080   → API for the iOS app (/api/v1, /api/v1/ws)
#
# Nebular OS is the published image, pinned by digest. Its secrets come from .env, which
# ./deploy.sh fills in (NOS_JWT_SECRET, NEBULAR_ACCESS_KEY_ID, NEBULAR_SECRET_ACCESS_KEY,
# NOS_METRICS_TOKEN).

x-shroud-logging: &shroud-logging
  RUST_LOG: ${RUST_LOG:-info}
  RUST_LOG_FORMAT: ${RUST_LOG_FORMAT:-text}

services:
  postgres:
    image: postgres:16-alpine
    container_name: shroud-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shroud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shroud}
      POSTGRES_DB: ${POSTGRES_DB:-shroud}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:-}
    volumes:
      - shroud_pg_data:/var/lib/postgresql/data
      - ./server/docker/init-admin-role.sh:/docker-entrypoint-initdb.d/20-admin-role.sh:ro
    networks:
      - shroud-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shroud} -d ${POSTGRES_DB:-shroud}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Rate-limit windows, presence and live events only: nothing is written to disk, and it
  # needs REDIS_PASSWORD (./deploy.sh fills in a missing one; letters and digits only).
  redis:
    image: redis:7-alpine
    container_name: shroud-redis
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-shroud}
      - --save
      - ""
      - --appendonly
      - "no"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-shroud}
    networks:
      - shroud-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nebular:
    # Nebular OS 0.2.0, pinned by digest so a pull can't swap it. To upgrade, change tag and
    # digest together (`docker buildx imagetools inspect ghcr.io/asp3x/nebular-os:<tag>`) after
    # reading the release's upgrade notes: a version that has written data can't be rolled back.
    image: ghcr.io/asp3x/nebular-os:0.2.0@sha256:5d18264c2c7c06ebfa5d515d3fc110fa90826032f28e0d92500fff15259bebc9
    container_name: shroud-nebular
    environment:
      <<: *shroud-logging
      NOS_BIND_ADDR: 0.0.0.0:9000
      NOS_DATA_DIR: /data/blobs
      NOS_META_PATH: /data/meta/metadata.db
      # Nebular refuses to start without it. Only Nebular knows it: the API has its own access
      # key below. Without NOS_SIGNING_SECRET, Nebular's presigned URLs are off.
      NOS_JWT_SECRET: ${NOS_JWT_SECRET:-}
      # The API's key. Requests are SigV4-signed (body hash included, replays refused after
      # 15 minutes); `editor` can read, write and delete but not reach maintenance, and the
      # policy keeps it to the media bucket.
      NOS_S3_ACCESS_KEY: ${NEBULAR_ACCESS_KEY_ID:-}
      NOS_S3_SECRET_KEY: ${NEBULAR_SECRET_ACCESS_KEY:-}
      NOS_S3_ACCESS_KEY_ROLE: editor
      NOS_BUCKET_POLICY: '{"${NEBULAR_ACCESS_KEY_ID:-}":["shroud-media"]}'
      # Deleted media is gone at once, instead of sitting on disk as a 24 h soft delete.
      NOS_SOFT_DELETE_TTL_SECS: "0"
      # Blobs are ciphertext, which compression can't shrink. The threshold sits
      # above the 2 GiB media cap so Nebular stores them as they are.
      NOS_COMPRESS_MIN_SIZE: "4294967296"
      # The API caps one media object at 2 GiB.
      NOS_MAX_BODY_SIZE: "2147483648"
      # Two full-size uploads can be in flight together.
      NOS_UPLOAD_MAX_IN_FLIGHT_BYTES: "4294967296"
      # No browser ever calls Nebular; an origin that can't exist allows none.
      NOS_CORS_ORIGINS: https://nebular.invalid
      NOS_METRICS_TOKEN: ${NOS_METRICS_TOKEN:-}
    volumes:
      - shroud_nebular_data:/data
    networks:
      - shroud-internal
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Only for the entrypoint, which hands /data to the `nos` user (uid 10001) and then starts
    # the server with none of them.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s
    restart: unless-stopped

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: shroud-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nebular:
        condition: service_healthy
    environment:
      <<: *shroud-logging
      DATABASE_URL: "postgres://${POSTGRES_USER:-shroud}:${POSTGRES_PASSWORD:-shroud}@postgres:5432/${POSTGRES_DB:-shroud}"
      DATABASE_POOL_MAX: "10"
      RUN_MIGRATIONS: "true"
      TRUST_FORWARDED_HEADERS: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD:-shroud}@redis:6379
      NEBULAR_URL: http://nebular:9000
      NEBULAR_MEDIA_BUCKET: shroud-media
      NEBULAR_ACCESS_KEY_ID: ${NEBULAR_ACCESS_KEY_ID:-}
      NEBULAR_SECRET_ACCESS_KEY: ${NEBULAR_SECRET_ACCESS_KEY:-}
      # Where earlier releases kept blobs. The API moves them into Nebular on start and reads
      # them from here until then; nothing new is written to it.
      MEDIA_DATA_DIR: /data/shroud-media
      HOST: 0.0.0.0
      PORT: "8080"
      # Operator listener. Same values as the admin service. Not in `ports:`:
      # only containers on shroud-internal can reach it. Unset token: the API
      # does not bind the port.
      OPERATOR_PORT: ${OPERATOR_PORT:-8090}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:8081}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      APNS_KEY_PATH: ${APNS_KEY_PATH:-}
      APNS_KEY_PEM: ${APNS_KEY_PEM:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-}
      APNS_ENVIRONMENT: ${APNS_ENVIRONMENT:-sandbox}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_ALLOWED_HOSTS: ${WEB_PUSH_ALLOWED_HOSTS:-}
      # Android push (UnifiedPush): ntfy.sh, up.conversations.im and Mozilla's autopush are
      # built in. Add your own distributor's push server (host suffixes, comma separated), or
      # allow any public https host. Google's push hosts are never accepted for Android.
      UNIFIEDPUSH_ALLOWED_HOSTS: ${UNIFIEDPUSH_ALLOWED_HOSTS:-}
      UNIFIEDPUSH_PUBLIC_HOSTS: ${UNIFIEDPUSH_PUBLIC_HOSTS:-false}
      # Calls: TURN_URLS + TURN_SECRET make the API mint short-lived logins for the coturn
      # below (docs/calls.md). TURN_USERNAME / TURN_CREDENTIAL are only for a hosted TURN
      # service with one fixed login.
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_CREDENTIAL_TTL_SECS: ${TURN_CREDENTIAL_TTL_SECS:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
      ICE_SERVERS_JSON: ${ICE_SERVERS_JSON:-}
      REACTIONS_MAX_PER_USER: ${REACTIONS_MAX_PER_USER:-5}
      # Update prompts (GET /client-version). Below *_LATEST_VERSION an app offers an update the
      # user may dismiss; below *_MIN_VERSION it blocks until updated, and once either minimum is
      # set the API answers 426 UPDATE_REQUIRED to older apps and to apps that don't name their
      # version (see .env.example). *_UPDATE_URL is where its Update button leads (TestFlight /
      # App Store, an APK page). Unset = never prompt.
      IOS_LATEST_VERSION: ${IOS_LATEST_VERSION:-}
      IOS_MIN_VERSION: ${IOS_MIN_VERSION:-}
      IOS_UPDATE_URL: ${IOS_UPDATE_URL:-}
      ANDROID_LATEST_VERSION: ${ANDROID_LATEST_VERSION:-}
      ANDROID_MIN_VERSION: ${ANDROID_MIN_VERSION:-}
      ANDROID_UPDATE_URL: ${ANDROID_UPDATE_URL:-}
      # The web bundle's build id, which ./deploy.sh (or deploy.ps1) writes after each deploy;
      # tabs built from another one are offered a reload. A file, read on each question, so a
      # web-only deploy doesn't restart the API.
      WEB_BUILD_FILE: /run/shroud/web-build
    volumes:
      - shroud_media_data:/data/shroud-media
      - ./.shroud-run:/run/shroud:ro
    networks:
      - shroud-internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/api/v1/health/ready >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Baked into the bundle; ./deploy.sh (or deploy.ps1) then hands the API the same id.
        WEB_BUILD: ${SHROUD_WEB_BUILD:-}
    container_name: shroud-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_UPSTREAM: http://api:8080
      ADMIN_UPSTREAM: http://admin:8082
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2147483648}
    networks:
      - shroud-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  # Operator console. Off unless COMPOSE_PROFILES includes admin (./deploy.sh --admin).
  # The web client proxies https://<shroud-host>/admin and /api/admin to this
  # container. It has no host port of its own. API secrets are not
  # copied in: a secret the console must know about arrives as <NAME>_SET=true.
  admin:
    profiles: ["admin"]
    build:
      context: .
      dockerfile: admin/Dockerfile
    container_name: shroud-admin
    environment:
      HOST: 0.0.0.0
      PORT: "8082"
      ADMIN_DIST: /ui/dist
      RUST_LOG: ${RUST_LOG:-info}
      RUST_LOG_FORMAT: ${RUST_LOG_FORMAT:-text}
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:-http://localhost:8081/admin}
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:-}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:-}
      OPERATOR_PORT: ${OPERATOR_PORT:-8090}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-}
      API_INTERNAL_URL: http://api:8080
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:8081}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      TRUST_FORWARDED_HEADERS: "true"
      DATABASE_URL: "postgres://${POSTGRES_USER:-shroud}@postgres:5432/${POSTGRES_DB:-shroud}"
      DATABASE_POOL_MAX: "10"
      RUN_MIGRATIONS: "true"
      REDIS_URL: redis://redis:6379
      NEBULAR_URL: http://nebular:9000
      NEBULAR_MEDIA_BUCKET: shroud-media
      NEBULAR_ACCESS_KEY_ID: ${NEBULAR_ACCESS_KEY_ID:-}
      MEDIA_DATA_DIR: /data/shroud-media
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-}
      APNS_ENVIRONMENT: ${APNS_ENVIRONMENT:-sandbox}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_ALLOWED_HOSTS: ${WEB_PUSH_ALLOWED_HOSTS:-}
      UNIFIEDPUSH_ALLOWED_HOSTS: ${UNIFIEDPUSH_ALLOWED_HOSTS:-}
      UNIFIEDPUSH_PUBLIC_HOSTS: ${UNIFIEDPUSH_PUBLIC_HOSTS:-false}
      TURN_URLS: ${TURN_URLS:-}
      TURN_CREDENTIAL_TTL_SECS: ${TURN_CREDENTIAL_TTL_SECS:-}
      TURN_REALM: ${TURN_REALM:-shroud}
      ICE_SERVERS_JSON: ${ICE_SERVERS_JSON:-}
      REACTIONS_MAX_PER_USER: ${REACTIONS_MAX_PER_USER:-5}
      IOS_LATEST_VERSION: ${IOS_LATEST_VERSION:-}
      IOS_MIN_VERSION: ${IOS_MIN_VERSION:-}
      IOS_UPDATE_URL: ${IOS_UPDATE_URL:-}
      ANDROID_LATEST_VERSION: ${ANDROID_LATEST_VERSION:-}
      ANDROID_MIN_VERSION: ${ANDROID_MIN_VERSION:-}
      ANDROID_UPDATE_URL: ${ANDROID_UPDATE_URL:-}
      WEB_BUILD_FILE: /run/shroud/web-build
      POSTGRES_PASSWORD_SET: ${POSTGRES_PASSWORD:+true}
      REDIS_PASSWORD_SET: ${REDIS_PASSWORD:+true}
      NOS_JWT_SECRET_SET: ${NOS_JWT_SECRET:+true}
      NEBULAR_SECRET_ACCESS_KEY_SET: ${NEBULAR_SECRET_ACCESS_KEY:+true}
      NOS_METRICS_TOKEN_SET: ${NOS_METRICS_TOKEN:+true}
      APNS_KEY_PATH_SET: ${APNS_KEY_PATH:+true}
      APNS_KEY_PEM_SET: ${APNS_KEY_PEM:+true}
      WEB_PUSH_VAPID_PRIVATE_KEY_SET: ${WEB_PUSH_VAPID_PRIVATE_KEY:+true}
      TURN_SECRET_SET: ${TURN_SECRET:+true}
      TURN_USERNAME_SET: ${TURN_USERNAME:+true}
      TURN_CREDENTIAL_SET: ${TURN_CREDENTIAL:+true}
    volumes:
      - ./.shroud-run:/run/shroud:ro
    networks:
      - shroud-internal
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  # TURN relay for calls whose networks refuse a direct path. Host networking: it hands out
  # relay ports from TURN_MIN_PORT–TURN_MAX_PORT (open those UDP ports and 3478 UDP/TCP).
  # Only logins the API minted with TURN_SECRET work, and it relays to public addresses only
  # (coturn's recommended private/reserved ranges are refused), UDP only.
  coturn:
    profiles: ["calls"]
    image: coturn/coturn:4.6
    container_name: shroud-coturn
    network_mode: host
    command:
      - -n
      # No log: coturn records each relay's client and peer addresses. To debug a relay, swap
      # these three lines for --log-file=stdout for a while.
      - --no-stdout-log
      - --log-file=/dev/null
      - --simple-log
      - --listening-port=3478
      - --min-port=${TURN_MIN_PORT:-49160}
      - --max-port=${TURN_MAX_PORT:-49259}
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-}
      - --realm=${TURN_REALM:-shroud}
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-tcp-relay
      - --no-multicast-peers
      - --no-software-attribute
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.0.0.0-192.0.0.255
      - --denied-peer-ip=192.0.2.0-192.0.2.255
      - --denied-peer-ip=192.88.99.0-192.88.99.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=198.18.0.0-198.19.255.255
      - --denied-peer-ip=198.51.100.0-198.51.100.255
      - --denied-peer-ip=203.0.113.0-203.0.113.255
      - --denied-peer-ip=240.0.0.0-255.255.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
      - --denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
      - --denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
      - --denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
    restart: unless-stopped

networks:
  shroud-internal:
    name: shroud-internal
    driver: bridge

volumes:
  shroud_pg_data:
  shroud_nebular_data:
  shroud_media_data:
