# Full stack: Postgres, Redis, Nebular OS (object storage), and shroud-server API.
# Agent: READS env defaults below; WRITES volumes; no production use.
#
# Networks
#   shroud-internal — private bridge for DB, Redis, and service-to-service traffic
#   proxy-network   — external network shared with Nginx Proxy Manager (public entry)
#
# Create the proxy network once if NPM has not already:
#   docker network create proxy-network
#
# NPM reverse-proxy targets (container DNS names on proxy-network):
#   http://shroud-api:8080   → API  (/api/v1, /api/v1/ws)
#   http://shroud-nebular:9000 → optional object store (server-side mirror; clients use API)
#
# Optional host ports for local tools / iOS Simulator without NPM
# (postgres/redis stay internal-only — never on proxy-network):
#   docker compose -f docker-compose.yml -f docker-compose.host-ports.yml up -d
#
# Nebular build context defaults to the sibling Ownly checkout (`../ownly/nebular-os`).
# Override with NEBULAR_CONTEXT=/path/to/nebular-os if needed.

x-shroud-logging: &shroud-logging
  # Ownly-style verbose defaults for local compose; override with RUST_LOG=...
  RUST_LOG: ${RUST_LOG:-debug}
  RUST_LOG_FORMAT: ${RUST_LOG_FORMAT:-text}

services:
  postgres:
    image: postgres:16-alpine
    container_name: shroud-postgres
    environment:
      POSTGRES_USER: shroud
      POSTGRES_PASSWORD: shroud
      POSTGRES_DB: shroud
    volumes:
      - shroud_pg_data:/var/lib/postgresql/data
    networks:
      - shroud-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shroud -d shroud"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: shroud-redis
    volumes:
      - shroud_redis_data:/data
    networks:
      - shroud-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Nebular OS object storage (same binary Ownly uses). Optional mirror for API replicas;
  # clients always upload/download via shroud-api `/media/{id}/content`.
  nebular:
    build:
      context: ${NEBULAR_CONTEXT:-../ownly/nebular-os}
      dockerfile: Dockerfile
    container_name: shroud-nebular
    environment:
      <<: *shroud-logging
      NOS_BIND_ADDR: 0.0.0.0:9000
      NOS_DATA_DIR: /data/blobs
      NOS_META_PATH: /data/meta/metadata.db
      # Local-only secrets — not for production.
      NOS_JWT_SECRET: shroud-compose-local-dev-nos-jwt-secret-not-for-production
      NOS_SIGNING_SECRET: shroud-compose-local-dev-nos-signing-secret-not-for-production
      JWT_SECRET: shroud-compose-local-dev-nos-jwt-secret-not-for-production
      SIGNING_SECRET: shroud-compose-local-dev-nos-signing-secret-not-for-production
    volumes:
      - shroud_nebular_data:/data
    networks:
      - shroud-internal
      - proxy-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s
    restart: unless-stopped

  # Public API — on proxy-network for NPM; on shroud-internal for Postgres/Redis/Nebular.
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: shroud-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nebular:
        condition: service_healthy
    environment:
      <<: *shroud-logging
      # Docker network hostnames on shroud-internal (not localhost).
      DATABASE_URL: postgres://shroud:shroud@postgres:5432/shroud
      DATABASE_POOL_MAX: "10"
      # Single compose replica runs migrations; set false on extra API replicas when scaling.
      RUN_MIGRATIONS: "true"
      # API sits behind NPM / reverse proxy — honor X-Forwarded-For for rate-limit keys.
      TRUST_FORWARDED_HEADERS: "true"
      REDIS_URL: redis://redis:6379
      NEBULAR_URL: http://nebular:9000
      NEBULAR_MEDIA_BUCKET: shroud-media
      # Encrypted blobs on the API volume; clients always use /media/{id}/content (API proxy).
      # Multi-replica deployments need a shared volume or Nebular as primary store.
      MEDIA_DATA_DIR: /data/shroud-media
      HOST: 0.0.0.0
      PORT: "8080"
      # Optional live APNs (pass through host env when set). Unset = register only / log send.
      APNS_KEY_PATH: ${APNS_KEY_PATH:-}
      APNS_KEY_PEM: ${APNS_KEY_PEM:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-}
      APNS_ENVIRONMENT: ${APNS_ENVIRONMENT:-sandbox}
      # WebRTC ICE (default public STUN; set TURN_* when coturn profile is enabled).
      TURN_URLS: ${TURN_URLS:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
      ICE_SERVERS_JSON: ${ICE_SERVERS_JSON:-}
    volumes:
      - shroud_media_data:/data/shroud-media
    networks:
      - shroud-internal
      - proxy-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/api/v1/health/ready >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  # Optional TURN for WebRTC when P2P fails. Enable with:
  #   docker compose --profile calls up -d
  # Then set TURN_URLS / TURN_USERNAME / TURN_CREDENTIAL and restart api.
  # host network: public media relay; not attached to compose bridges.
  coturn:
    profiles: ["calls"]
    image: coturn/coturn:4.6
    container_name: shroud-coturn
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --fingerprint
      - --lt-cred-mech
      - --user=shroud:shroud
      - --realm=shroud.local
      - --no-cli
      - --no-tls
      - --no-dtls
    restart: unless-stopped

networks:
  # Private service mesh: Postgres, Redis, and API↔Nebular over Docker DNS.
  shroud-internal:
    name: shroud-internal
    driver: bridge

  # Shared with Nginx Proxy Manager — only reverse-proxied services join this.
  # Must exist before `compose up` (NPM usually creates it):
  #   docker network create proxy-network
  proxy-network:
    name: proxy-network
    external: true

volumes:
  shroud_pg_data:
  shroud_redis_data:
  shroud_nebular_data:
  shroud_media_data:
