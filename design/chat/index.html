<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Shroud</title>
  <meta name="description" content="Working proposal for the reworked chat screen of the Shroud web client: every control responds, and what would need the server is simulated in the page." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ------------------------------------------------------------- tokens --
       The web client's palette (web/src/index.css), plus the outgoing bubble roles
       this proposal adds. Everything else is unchanged. */
    :root {
      color-scheme: light dark;
      --font: Inter, system-ui, -apple-system, sans-serif;
      --fs-2xs: 11px; --fs-xs: 12px; --fs-sm: 13px; --fs-md: 14px;
      --fs-base: 15px; --fs-lg: 17px; --fs-xl: 20px; --fs-2xl: 24px;
      --r-xs: 8px; --r-sm: 10px; --r-md: 12px; --r-lg: 16px; --r-full: 999px;
      --rail-w: 76px; --pane-w: 340px;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);

      --bg: #000000; --surface-1: #0a0a0e; --surface-2: #17171d; --surface-3: #22222a; --canvas: #0e0e14;
      --hover: rgba(255, 255, 255, 0.055); --pressed: rgba(255, 255, 255, 0.09);
      --separator: #2a2a31;
      --text-primary: #ffffff; --text-secondary: #a6a6b0; --text-tertiary: #8a8a99;
      --accent: #6464f2; --accent-hover: #7878f6; --accent-soft: #23234a; --accent-text: #a7a7fa; --on-accent: #ffffff;
      --bubble-in: #22222a; --bubble-border: transparent;
      --bubble-out: color-mix(in srgb, var(--accent) 24%, var(--canvas));
      --bubble-out-text: var(--text-primary); --bubble-out-meta: var(--accent-text);
      --danger: #ff6b61; --danger-soft: #3a1512; --online: #34c759;
      --ok-bg: #14331c; --ok-text: #7ddea0;
      --scrim: rgba(0, 0, 0, 0.66);
      --shadow-md: 0 14px 40px rgba(0, 0, 0, 0.6);
    }
    :root[data-theme="light"] {
      --bg: #ffffff; --surface-1: #f7f7fa; --surface-2: #ffffff; --surface-3: #ffffff; --canvas: #f1f1f6;
      --hover: rgba(10, 10, 25, 0.045); --pressed: rgba(10, 10, 25, 0.08);
      --separator: #e2e2e8;
      --text-primary: #0b0b12; --text-secondary: #555562; --text-tertiary: #6c6c7a;
      --accent: #5e5ce6; --accent-hover: #4b49d6; --accent-soft: #ececfc; --accent-text: #4b49d6;
      --bubble-in: #ffffff; --bubble-border: #e5e5ec;
      --bubble-out: color-mix(in srgb, var(--accent) 13%, #ffffff);
      --danger: #d02a1b; --danger-soft: #fdecea; --online: #1b7e3f;
      --ok-bg: #e4f7ea; --ok-text: #1d7a3e;
      --scrim: rgba(18, 18, 30, 0.34);
      --shadow-md: 0 14px 40px rgba(15, 15, 30, 0.16);
    }
    :root[data-out="solid"] { --bubble-out: var(--accent); --bubble-out-text: var(--on-accent); --bubble-out-meta: rgba(255, 255, 255, 0.82); }

    /* --------------------------------------------------------------- base -- */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: var(--font); font-size: var(--fs-base); line-height: 1.4; background: var(--bg); color: var(--text-primary); -webkit-font-smoothing: antialiased; overflow: hidden; }
    button { font: inherit; color: inherit; cursor: pointer; }
    a { color: var(--accent-text); }
    svg { display: block; }
    .ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .ico-18 { width: 18px; height: 18px; } .ico-16 { width: 16px; height: 16px; } .ico-14 { width: 14px; height: 14px; } .ico-13 { width: 13px; height: 13px; }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-xs); }
    .hidden { display: none !important; }
    mark { background: var(--accent-soft); color: var(--accent-text); border-radius: 3px; padding: 0 1px; }

    .icon-btn { width: 36px; height: 36px; border-radius: var(--r-sm); border: 0; background: transparent; color: var(--text-secondary); display: grid; place-items: center; flex-shrink: 0; transition: background 0.15s ease, color 0.15s ease; }
    .icon-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-text); }
    @media (hover: hover) { .icon-btn:hover { background: var(--hover); color: var(--text-primary); } }
    .btn { height: 44px; padding: 0 18px; border-radius: 12px; border: 0; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: var(--fs-base); font-weight: 600; background: var(--accent); color: var(--on-accent); }
    .btn.secondary { background: var(--surface-3); color: var(--text-primary); border: 1px solid var(--separator); }
    .btn.danger { background: var(--danger); color: #fff; }
    .btn.text { background: transparent; color: var(--accent-text); padding: 0 8px; }
    @media (hover: hover) { .btn:hover { filter: brightness(1.08); } }
    .field { width: 100%; height: 42px; border-radius: var(--r-sm); border: 1px solid var(--separator); background: var(--surface-2); color: var(--text-primary); padding: 0 12px; font: inherit; font-size: var(--fs-base); outline: none; }
    .field:focus { border-color: var(--accent); }

    .avatar { position: relative; flex-shrink: 0; width: 44px; height: 44px; border-radius: var(--r-full); background: linear-gradient(180deg, var(--av-top, #7c7aff), var(--av-bottom, #5e5ce6)); color: #fff; display: grid; place-items: center; font-size: var(--fs-base); font-weight: 600; letter-spacing: 0.01em; user-select: none; }
    .avatar-sm { width: 32px; height: 32px; font-size: var(--fs-xs); }
    .avatar-xs { width: 22px; height: 22px; font-size: 9px; }
    .avatar-lg { width: 72px; height: 72px; font-size: 26px; }
    .avatar.avatar-xl { width: 112px; height: 112px; font-size: 46px; }
    .avatar-dot { position: absolute; right: 0; bottom: 0; width: 11px; height: 11px; border-radius: 50%; background: var(--online); box-shadow: 0 0 0 2px var(--surface-1); }
    .avatar-lg .avatar-dot { width: 16px; height: 16px; right: 3px; bottom: 3px; }
    .av-orange { --av-top: #ff9f5a; --av-bottom: #f76b1c; } .av-pink { --av-top: #ff7a9e; --av-bottom: #e64a72; } .av-blue { --av-top: #4ac7fa; --av-bottom: #2e8fe0; }
    .av-green { --av-top: #5ad97c; --av-bottom: #2fa85b; } .av-violet { --av-top: #c77cff; --av-bottom: #9b4ae6; } .av-yellow { --av-top: #ffc65a; --av-bottom: #e69a1c; } .av-grey { --av-top: #8e8e93; --av-bottom: #5f5f66; }

    /* -------------------------------------------------------------- shell -- */
    .shell { display: flex; height: 100%; background: var(--bg); }
    .shell-body { display: flex; flex: 1; min-height: 0; min-width: 0; }
    .rail { width: var(--rail-w); flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 18px 0; border-right: 1px solid var(--separator); }
    .rail-mark { width: 36px; height: 36px; margin-bottom: 12px; }
    .rail-mark svg { width: 36px; height: 36px; border-radius: 22.5%; }
    .rail-tabs { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .rail-btn { position: relative; width: 46px; height: 46px; border-radius: var(--r-md); border: 0; background: transparent; color: var(--text-secondary); display: grid; place-items: center; }
    .rail-btn.active { background: var(--accent-soft); color: var(--accent-text); }
    @media (hover: hover) { .rail-btn:not(.active):hover { background: var(--hover); color: var(--text-primary); } }
    .rail-badge { position: absolute; top: 4px; right: 4px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: var(--r-full); background: var(--accent); color: var(--on-accent); font-size: 10px; font-weight: 700; line-height: 17px; text-align: center; box-shadow: 0 0 0 2px var(--bg); }
    .rail-me { border: 0; background: transparent; padding: 2px; border-radius: var(--r-full); display: grid; }
    .rail-me[aria-expanded="true"] { box-shadow: 0 0 0 2px var(--accent); }

    /* --------------------------------------------------------------- pane -- */
    .pane { width: var(--pane-w); flex-shrink: 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--surface-1); border-right: 1px solid var(--separator); }
    .pane-head { padding: 16px 14px 10px; display: flex; flex-direction: column; gap: 10px; }
    .pane-title-row { display: flex; justify-content: space-between; align-items: center; padding-left: 4px; }
    .pane-title-row h1 { margin: 0; font-size: var(--fs-2xl); font-weight: 700; letter-spacing: -0.02em; }
    .search { height: 36px; border-radius: var(--r-sm); background: var(--surface-2); display: flex; align-items: center; gap: 8px; padding: 0 10px; color: var(--text-tertiary); font-size: var(--fs-md); border: 1px solid transparent; transition: border-color 0.15s ease; }
    :root[data-theme="light"] .search { border-color: var(--separator); }
    .search:focus-within { border-color: var(--accent); }
    .search input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: var(--text-primary); font: inherit; font-size: var(--fs-md); }
    .search input::placeholder { color: var(--text-tertiary); }
    .search input::-webkit-search-cancel-button { display: none; }
    .search-clear { border: 0; background: transparent; color: var(--text-tertiary); display: grid; place-items: center; padding: 2px; border-radius: var(--r-full); }
    .pane-notice { display: flex; align-items: center; gap: 10px; margin: 0 14px 6px; padding: 8px 2px 10px; border-bottom: 1px solid var(--separator); font-size: var(--fs-sm); color: var(--text-secondary); }
    .pane-notice > .ico { color: var(--accent-text); }
    .pane-notice span { flex: 1; min-width: 0; }
    .pane-notice a { color: var(--accent-text); font-weight: 600; text-decoration: none; white-space: nowrap; }
    .pane-notice .icon-btn { width: 28px; height: 28px; margin: -4px -6px -4px 0; }
    .rows { flex: 1; overflow-y: auto; padding: 2px 8px 12px; }
    .rows-empty { padding: 28px 16px; color: var(--text-secondary); font-size: var(--fs-sm); line-height: 1.5; }
    .rows-empty strong { display: block; font-size: var(--fs-base); color: var(--text-primary); margin-bottom: 4px; }
    .list-label { margin: 10px 8px 4px; font-size: var(--fs-2xs); font-weight: 700; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.06em; }
    .row { display: flex; gap: 12px; align-items: center; width: 100%; padding: 9px 10px; border-radius: var(--r-md); border: 0; background: transparent; color: inherit; text-align: left; transition: background 0.12s ease; }
    @media (hover: hover) { .row:not(.active):hover { background: var(--hover); } }
    .row.active { background: var(--accent-soft); }
    .row-copy { flex: 1; min-width: 0; }
    .row-copy strong { font-size: var(--fs-base); font-weight: 600; display: flex; align-items: center; gap: 5px; min-width: 0; }
    .row-copy strong > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-copy strong .ico { color: var(--text-tertiary); }
    .row-copy > span { display: block; margin-top: 1px; font-size: var(--fs-sm); color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row.unread .row-copy > span { color: var(--text-primary); }
    .row-copy .typing { color: var(--accent-text); font-weight: 500; }
    .typing-dots { display: inline-flex; gap: 2px; margin-left: 3px; vertical-align: 1px; }
    .typing-dots i { width: 3px; height: 3px; border-radius: 50%; background: currentColor; animation: typing-dot 1.35s cubic-bezier(0.45, 0, 0.35, 1) infinite both; }
    .typing-dots i:nth-child(2) { animation-delay: 0.17s; } .typing-dots i:nth-child(3) { animation-delay: 0.34s; }
    @keyframes typing-dot { 0%, 56%, 100% { translate: 0 0; opacity: 0.4; } 24% { translate: 0 -2.5px; opacity: 1; } }
    .row-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; align-self: stretch; padding-top: 3px; }
    .row-time { font-size: var(--fs-2xs); color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
    .row.unread .row-time { color: var(--accent-text); font-weight: 600; }
    .row-badges { display: flex; align-items: center; gap: 4px; }
    .row-unread { min-width: 20px; height: 20px; padding: 0 6px; display: grid; place-items: center; border-radius: var(--r-full); background: var(--accent); color: var(--on-accent); font-size: var(--fs-2xs); font-weight: 700; font-variant-numeric: tabular-nums; }
    .row-unread.muted { background: var(--text-tertiary); color: var(--bg); }
    .row-reaction { width: 20px; height: 20px; display: grid; place-items: center; border-radius: var(--r-full); background: var(--accent); color: var(--on-accent); }
    .row-reaction .ico { width: 11px; height: 11px; fill: currentColor; }
    .row-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .mini-btn { height: 27px; padding: 0 11px; border-radius: var(--r-xs); border: 0; background: var(--accent); color: var(--on-accent); font-size: var(--fs-xs); font-weight: 600; }
    .mini-btn.ghost { background: var(--surface-3); color: var(--text-primary); border: 1px solid var(--separator); }
    @keyframes pop { 0% { transform: scale(0.4); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: none; } }

    /* ------------------------------------------------------------- thread -- */
    .thread { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--canvas); position: relative; }
    .thread-head { height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 16px; background: var(--bg); border-bottom: 1px solid var(--separator); }
    .thread-head .avatar-dot { box-shadow: 0 0 0 2px var(--bg); }
    .thread-head .peer-btn { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; border: 0; background: transparent; padding: 0; text-align: left; }
    .thread-peer { flex: 1; min-width: 0; }
    .thread-peer strong { display: flex; align-items: center; gap: 6px; font-size: var(--fs-lg); font-weight: 600; white-space: nowrap; }
    .thread-peer strong > span { overflow: hidden; text-overflow: ellipsis; }
    .thread-peer strong .ico { color: var(--accent-text); }
    .thread-peer > span { display: block; font-size: var(--fs-xs); color: var(--text-secondary); }
    .thread-peer > span.online { color: var(--online); }
    .thread-peer > span.typing { color: var(--accent-text); font-weight: 500; }
    .back-mobile { display: none; }
    .thread-actions { display: flex; gap: 2px; }
    .search-wrap { flex-shrink: 0; }
    .thread-search { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px 16px; background: var(--bg); border-bottom: 1px solid var(--separator); color: var(--text-tertiary); }
    .fly-glyph { pointer-events: none; }
    .thread-search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; color: var(--text-primary); font: inherit; font-size: 16px; }
    .thread-search input::placeholder { color: var(--text-tertiary); }
    .thread-search-count { font-size: var(--fs-xs); color: var(--text-secondary); flex-shrink: 0; white-space: nowrap; }
    .thread-empty { margin: auto; max-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 24px; }
    .thread-empty strong { font-size: var(--fs-lg); }
    .thread-empty p { margin: 0; font-size: var(--fs-sm); color: var(--text-secondary); line-height: 1.5; }

    .messages { flex: 1; min-height: 0; overflow-y: auto; }
    .messages-inner { min-height: 100%; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; padding: 20px 24px 22px; }
    .day-sep { display: flex; justify-content: center; margin: 18px 0 8px; }
    .day-sep span { font-size: var(--fs-2xs); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-tertiary); }
    .msg-row { position: relative; display: flex; align-items: flex-end; gap: 4px; -webkit-touch-callout: none; }
    .msg-row.mine { justify-content: flex-end; }
    .msg-row.first { margin-top: 10px; }
    .msg-row.flash::before { content: ""; position: absolute; inset: -2px -24px; border-radius: var(--r-sm); background: color-mix(in srgb, var(--accent) 22%, transparent); animation: reply-flash 1.4s var(--ease) forwards; pointer-events: none; }
    @keyframes reply-flash { 0% { opacity: 0; } 12% { opacity: 1; } 62% { opacity: 1; } 100% { opacity: 0; } }
    .hover-actions { display: flex; align-items: flex-end; opacity: 0; transition: opacity 0.12s var(--ease); }
    .msg-row.mine .hover-actions { order: -1; }
    .hover-actions .icon-btn { width: 30px; height: 30px; color: var(--text-tertiary); }
    @media (hover: hover) { .msg-row:hover .hover-actions, .msg-row.menu-open .hover-actions { opacity: 1; } }
    .bubble { position: relative; max-width: min(560px, 74%); padding: 7px 13px; display: flex; align-items: flex-end; gap: 9px; font-size: var(--fs-base); line-height: 1.4; border-radius: var(--r-lg); }
    .msg-row.is-new .bubble { animation: bubble-in 0.22s var(--ease); }
    @keyframes bubble-in { from { opacity: 0; transform: translateY(6px); } }
    .bubble p { margin: 0; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .bubble-meta { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-2xs); line-height: 1; padding-bottom: 1px; font-variant-numeric: tabular-nums; }
    .bubble.in { background: var(--bubble-in); border: 1px solid var(--bubble-border); border-bottom-left-radius: var(--r-xs); }
    .msg-row:not(.first) .bubble.in { border-top-left-radius: var(--r-xs); }
    .bubble.in .bubble-meta { color: var(--text-secondary); }
    .bubble.out { background: var(--bubble-out); color: var(--bubble-out-text); border-bottom-right-radius: var(--r-xs); }
    .msg-row:not(.first) .bubble.out { border-top-right-radius: var(--r-xs); }
    .bubble.out .bubble-meta { color: var(--bubble-out-meta); }
    .bubble.pending { opacity: 0.68; }
    .bubble.deleted { opacity: 0.6; font-style: italic; }
    .receipt-read { color: var(--accent-text); }
    :root[data-out="solid"] .bubble.out .receipt-read { color: #fff; }
    .bubble.col { flex-direction: column; align-items: stretch; gap: 5px; }
    .bubble-body { display: flex; align-items: flex-end; gap: 9px; min-width: 0; }
    .bubble-meta-row { display: flex; justify-content: flex-end; margin-top: -1px; }
    .msg-link { color: var(--accent-text); text-decoration: none; overflow-wrap: anywhere; }
    :root[data-out="solid"] .bubble.out .msg-link { color: var(--on-accent); text-decoration: underline; text-underline-offset: 2px; }
    @media (hover: hover) { .msg-link:hover { text-decoration: underline; } }
    .quote { display: flex; align-items: center; gap: 8px; width: 100%; min-width: 0; padding: 4px 8px 5px 9px; border: 0; border-left: 3px solid var(--accent-text); border-radius: 6px; background: color-mix(in srgb, var(--accent) 14%, transparent); font: inherit; font-size: var(--fs-md); line-height: 1.3; text-align: left; text-decoration: none; color: inherit; cursor: pointer; }
    :root[data-out="solid"] .bubble.out .quote { border-left-color: var(--on-accent); background: rgba(0, 0, 0, 0.12); }
    :root[data-out="solid"] .bubble.out .quote strong, :root[data-out="solid"] .bubble.out .quote em, :root[data-out="solid"] .bubble.out .quote small { color: var(--on-accent); }
    .quote-lines { display: flex; flex-direction: column; min-width: 0; }
    .quote strong { font-weight: 600; color: var(--accent-text); }
    .quote em { font-style: normal; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .quote small { font-size: var(--fs-sm); color: var(--text-secondary); }
    .quote-thumb { position: relative; flex: 0 0 auto; width: 44px; height: 44px; border-radius: 5px; overflow: hidden; background: linear-gradient(160deg, #2b4a6f 0%, #5f8fb8 55%, #d6c08a 100%); }
    .quote-thumb img, .quote-thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .quote-thumb .media-play { width: 20px; height: 20px; background: rgba(11, 11, 18, 0.6); }
    .quote-thumb .media-dur { display: none; }
    .bubble.voice { flex-direction: column; align-items: stretch; gap: 0; padding: 8px 10px; }
    .voice-row { display: flex; align-items: center; gap: 10px; }
    .voice-play { width: 36px; height: 36px; flex-shrink: 0; border: 0; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; }
    .voice-play .ico { width: 16px; height: 16px; fill: currentColor; stroke: none; }
    .voice-play .ico.play { transform: translateX(1px); }
    .voice-body { display: flex; flex-direction: column; gap: 5px; min-width: 170px; }
    .wave { display: flex; align-items: center; gap: 2px; height: 26px; cursor: pointer; }
    .wave i { flex: 1 1 0; border-radius: 2px; background: color-mix(in srgb, var(--accent) 28%, transparent); }
    .wave i.played { background: var(--accent); }
    .voice-foot { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
    .voice-foot .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
    .voice-foot .bubble-meta { margin-left: auto; }
    .bubble.photo-msg { padding: 0; overflow: hidden; border-radius: var(--r-lg); }
    .photo { position: relative; display: block; width: 260px; max-width: 100%; aspect-ratio: 4 / 3; border: 0; padding: 0; background: linear-gradient(160deg, #2b4a6f 0%, #5f8fb8 55%, #d6c08a 100%); cursor: zoom-in; }
    .photo img, .photo video { display: block; width: 100%; height: 100%; object-fit: cover; }
    .media-play { position: absolute; inset: 0; margin: auto; width: 44px; height: 44px; border-radius: 50%; background: rgba(11, 11, 18, 0.55); color: #fff; display: grid; place-items: center; pointer-events: none; }
    .media-play .ico { fill: currentColor; stroke: none; transform: translateX(1px); }
    .media-play.big { width: 72px; height: 72px; pointer-events: auto; cursor: pointer; }
    .media-play.big .ico { width: 30px; height: 30px; }
    .playing .media-play.big { opacity: 0; }
    .media-dur { position: absolute; left: 8px; bottom: 8px; padding: 3px 7px; border-radius: var(--r-full); background: rgba(0, 0, 0, 0.45); color: #fff; font-size: 11px; font-variant-numeric: tabular-nums; pointer-events: none; }
    .media-progress { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255, 255, 255, 0.25); }
    .media-progress i { display: block; height: 100%; width: 0; background: #fff; }
    .playing .media-progress i { animation: media-progress var(--d, 10s) linear forwards; }
    @keyframes media-progress { to { width: 100%; } }
    .viewer .photo video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    .photo .bubble-meta { position: absolute; right: 8px; bottom: 8px; padding: 3px 7px; border-radius: var(--r-full); background: rgba(0, 0, 0, 0.45); color: #fff; }
    .bubble.file-msg { gap: 10px; align-items: center; }
    .file-icon { width: 40px; height: 40px; border-radius: var(--r-sm); background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent-text); display: grid; place-items: center; flex-shrink: 0; }
    :root[data-out="solid"] .bubble.out .file-icon { background: rgba(255, 255, 255, 0.2); color: #fff; }
    .file-lines { display: flex; flex-direction: column; min-width: 0; }
    .file-lines strong { font-weight: 600; font-size: var(--fs-md); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-lines span { font-size: var(--fs-xs); opacity: 0.75; }
    .reaction-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 3px; }
    .reaction-chip { display: inline-flex; align-items: center; min-height: 28px; padding: 0 4px 0 6px; border: 0; border-radius: 14px; background: color-mix(in srgb, var(--accent) 16%, transparent); font-size: 16px; line-height: 1; color: inherit; transition: transform 0.08s var(--ease); }
    .reaction-chip:active { transform: scale(0.9); }
    .reaction-chip.mine { background: var(--accent); color: #fff; }
    .reaction-chip .avatar-xs { margin-left: 4px; box-shadow: 0 0 0 1.5px var(--accent); }
    .reaction-chip .avatar-xs + .avatar-xs { margin-left: -8px; }
    .reaction-strip .bubble-meta { margin-left: auto; padding-left: 6px; }
    .typing-bubble { padding: 8px 13px 9px; }
    .typing-ink { display: flex; align-items: center; gap: 5px; width: 40px; height: 20px; justify-content: center; }
    .typing-ink i { width: 7px; height: 7px; border-radius: 50%; background: color-mix(in srgb, var(--accent) 42%, var(--bubble-in)); animation: typing-ink 1.35s cubic-bezier(0.45, 0, 0.35, 1) infinite both; }
    .typing-ink i:nth-child(2) { animation-delay: 0.17s; } .typing-ink i:nth-child(3) { animation-delay: 0.34s; }
    @keyframes typing-ink { 0%, 56%, 100% { transform: translateY(0) scale(0.85); } 24% { transform: translateY(-4px) scale(1.2); background: var(--accent); } }
    .jump-latest { position: absolute; right: 22px; bottom: 76px; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: var(--r-full); border: 1px solid var(--separator); background: var(--surface-2); color: var(--text-primary); font-size: var(--fs-xs); font-weight: 600; box-shadow: var(--shadow-md); animation: bubble-in 0.2s var(--ease); }
    .jump-latest .count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--r-full); background: var(--accent); color: #fff; font-size: 10px; display: grid; place-items: center; }

    /* ----------------------------------------------------------- composer -- */
    .compose-shell { flex-shrink: 0; background: var(--bg); border-top: 1px solid var(--separator); }
    /* Replying: the message itself, small, above the field. The arrow sits over the attach
       buttons, the miniature over the text field, the close button over the mic. */
    .reply-bar { display: flex; align-items: center; gap: 4px; padding: 8px 12px 0; animation: reply-in 0.22s var(--ease); }
    .reply-bar-icon { width: 76px; display: flex; justify-content: center; color: var(--accent-text); flex-shrink: 0; }
    .reply-bar-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; margin: 0 4px; }
    .reply-bar-label { font-size: var(--fs-xs); color: var(--text-secondary); display: flex; align-items: baseline; gap: 6px; }
    .reply-bar-label b { font-weight: 600; color: var(--text-primary); }
    .reply-bar-label time { color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
    .reply-bar-msg { display: flex; align-items: flex-end; gap: 6px; max-width: 100%; padding: 0; border: 0; background: transparent; color: inherit; text-align: left; cursor: pointer; }
    .reply-mini { display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; padding: 5px 11px; border-radius: 12px; border-bottom-left-radius: 4px; background: var(--bubble-in); border: 1px solid var(--bubble-border); font-size: var(--fs-sm); line-height: 1.35; color: var(--text-primary); transform-origin: left bottom; animation: mini-in 0.26s cubic-bezier(0.2, 0.9, 0.25, 1.15) both; animation-delay: 40ms; }
    .reply-mini > span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .reply-mini em { font-style: italic; color: var(--text-secondary); }
    .reply-mini .ico { color: var(--accent-text); }
    .reply-mini .ico.fill { fill: currentColor; stroke: none; }
    .reply-mini.out { background: var(--bubble-out); color: var(--bubble-out-text); border-bottom-left-radius: 12px; border-bottom-right-radius: 4px; }
    :root[data-out="solid"] .reply-mini.out .ico { color: var(--on-accent); }
    /* Pictures and videos: the frame is the miniature, with the bubble's corners. */
    .reply-mini.media { padding: 0; background: transparent; border: 0; overflow: visible; }
    .reply-mini-pic { position: relative; width: 84px; height: 63px; border-radius: 12px; border-bottom-left-radius: 4px; overflow: hidden; flex-shrink: 0; background: linear-gradient(160deg, #2b4a6f 0%, #5f8fb8 55%, #d6c08a 100%); box-shadow: 0 1px 0 var(--bubble-border); }
    .reply-mini.out .reply-mini-pic { border-bottom-left-radius: 12px; border-bottom-right-radius: 4px; }
    .reply-mini-pic img, .reply-mini-pic video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .reply-mini-pic .media-play { width: 26px; height: 26px; background: rgba(11, 11, 18, 0.6); }
    .reply-mini-pic .media-dur { left: 5px; bottom: 5px; padding: 2px 5px; font-size: 10px; }
    .reply-mini-cap { align-self: center; margin-left: 4px; font-size: var(--fs-sm); color: var(--text-secondary); }
    @media (hover: hover) { .reply-bar-msg:hover .reply-mini { filter: brightness(1.12); } }
    .reply-bar .icon-btn { width: 34px; height: 34px; align-self: flex-end; }
    @keyframes mini-in { from { opacity: 0; transform: scale(0.85) translateY(4px); } }
    @keyframes reply-in { from { opacity: 0; transform: translateY(8px); } }
    .thread-banner { margin: 0; padding: 8px 16px; font-size: var(--fs-sm); text-align: center; background: var(--accent-soft); color: var(--accent-text); }
    .compose { display: flex; gap: 4px; align-items: flex-end; padding: 8px 12px; }
    .compose .icon-btn { width: 34px; height: 34px; margin-bottom: 1px; }
    .compose-plus { display: none; }
    .compose-grow { flex: 1; min-width: 0; margin: 0 4px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid transparent; transition: border-color 0.15s ease; }
    :root[data-theme="light"] .compose-grow { border-color: var(--separator); }
    .compose-grow:focus-within { border-color: var(--accent); }
    .compose-field { display: block; width: 100%; min-height: 34px; max-height: 160px; padding: 7px 12px; border: 0; background: transparent; color: var(--text-primary); font: inherit; font-size: var(--fs-base); line-height: 1.35; outline: none; resize: none; }
    .compose-field::placeholder { color: var(--text-tertiary); }
    .compose-mic { color: var(--accent-text); touch-action: none; user-select: none; -webkit-user-select: none; }
    .send { width: 34px; height: 34px; border-radius: var(--r-full); border: 0; background: var(--accent); color: var(--on-accent); display: none; place-items: center; margin-bottom: 1px; transition: transform 0.12s ease; }
    .send:active { transform: scale(0.94); }
    .compose.has-draft .send { display: grid; }
    .compose.has-draft .compose-mic { display: none; }
    /* Recording: the bin takes the attach buttons' place, the capsule the field's, send the mic's.
       The capsule's parts slide in one after another; the buttons pop in with a little overshoot. */
    .compose.recording .compose-wide, .compose.recording .compose-plus, .compose.recording .compose-grow, .compose.recording .compose-mic { display: none; }
    .rec-discard { display: none; color: var(--danger); }
    .compose.recording .rec-discard { display: grid; animation: pop-in 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) 60ms both; }
    @media (hover: hover) { .rec-discard:hover { background: var(--danger-soft); color: var(--danger); } }
    .compose.recording .send { display: grid; animation: pop-in 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) 120ms both; }
    @keyframes pop-in { from { opacity: 0; scale: 0.4; } }
    .rec-capsule { display: none; flex: 1; min-width: 0; height: 34px; margin: 0 4px 1px; align-items: center; gap: 10px; padding: 0 12px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
    .compose.recording .rec-capsule { display: flex; animation: capsule-in 0.26s var(--ease) both; }
    @keyframes capsule-in { from { opacity: 0; scale: 0.96; } }
    .rec-capsule > * { animation: part-in 0.3s var(--ease) both; }
    .rec-capsule > :nth-child(2) { animation-delay: 60ms; } .rec-capsule > :nth-child(3) { animation-delay: 120ms; }
    @keyframes part-in { from { opacity: 0; translate: -8px 0; } }
    .rec-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); flex-shrink: 0; animation: rec-pulse 1.4s ease-in-out infinite; }
    @keyframes rec-pulse { 50% { opacity: 0.3; } }
    .rec-time { min-width: 40px; font-size: var(--fs-base); font-weight: 500; font-variant-numeric: tabular-nums; color: var(--text-primary); }
    .rec-wave { flex: 1; min-width: 0; height: 22px; overflow: hidden; display: flex; justify-content: flex-end; }
    .rec-wave.scrolling { -webkit-mask-image: linear-gradient(90deg, transparent, #000 32px); mask-image: linear-gradient(90deg, transparent, #000 32px); }
    .rec-wave-track { display: flex; align-items: center; gap: 2px; height: 100%; }
    .rec-wave-track i { flex: 0 0 3px; border-radius: 2px; background: var(--accent); animation: bar-in 0.22s var(--ease) both; }
    @keyframes bar-in { from { scale: 1 0.25; opacity: 0.35; } }
    /* Send: everything lifts away together. Discard: the capsule retracts into the bin, which catches it. */
    .compose[data-close="send"] :is(.rec-capsule > *, .rec-discard, .send) { opacity: 0; translate: 0 -6px; transition: opacity 0.14s ease, translate 0.2s var(--ease); animation: none; }
    .compose[data-close="discard"] .rec-capsule { clip-path: inset(0 100% 0 0 round 12px); transition: clip-path 0.22s cubic-bezier(0.45, 0, 0.8, 0.35); box-shadow: none; }
    .compose[data-close="discard"] .rec-capsule > * { opacity: 0; transition: opacity 0.1s ease; animation: none; }
    .compose[data-close="discard"] .send { opacity: 0; scale: 0.6; transition: opacity 0.14s ease, scale 0.2s ease-in; animation: none; }
    .compose[data-close="discard"] .rec-discard { animation: bin-catch 0.28s ease-in-out 0.16s; }
    @keyframes bin-catch { 35% { rotate: -14deg; scale: 1.12; } 70% { rotate: 9deg; } }

    /* -------------------------------------------------------------- menus -- */
    .ctx-menu { position: fixed; z-index: 70; min-width: 200px; max-width: 300px; padding: 6px; display: flex; flex-direction: column; gap: 2px; background: var(--surface-2); border: 1px solid var(--separator); border-radius: var(--r-md); box-shadow: var(--shadow-md); will-change: clip-path, opacity; animation: ctx-in 0.22s var(--ease) both; }
    .ctx-menu.closing { animation: ctx-out 0.12s ease-in both; pointer-events: none; }
    .account-menu, .account-menu.closing { animation: none; min-width: 236px; padding: 6px; border-radius: 14px; }
    .acct-head { display: flex; align-items: center; gap: 12px; padding: 10px 10px 12px; margin-bottom: 4px; border-bottom: 1px solid var(--separator); }
    .acct-head .avatar { width: 40px; height: 40px; font-size: var(--fs-md); }
    .acct-head .avatar-dot { box-shadow: 0 0 0 2px var(--surface-2); }
    .acct-head-text { display: flex; flex-direction: column; min-width: 0; }
    .acct-head-text strong { font-size: var(--fs-base); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .acct-head-text span { font-size: var(--fs-xs); color: var(--text-secondary); }
    .fly-avatar { pointer-events: none; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35); }
    /* A chat's menu: the pane dims, the row lifts off the list, the menu unfolds from its edge. */
    .chat-menu-layer { position: fixed; inset: 0; z-index: 69; }
    .chat-menu-scrim { position: absolute; inset: 0; background: color-mix(in srgb, var(--bg) 55%, transparent); }
    .chat-menu-row { position: fixed; z-index: 1; background: var(--surface-2); border-radius: var(--r-md); pointer-events: none; will-change: transform; }
    :root[data-theme="light"] .chat-menu-row { background: #fff; }
    .chat-menu-row.active { background: var(--accent-soft); }
    .chat-menu { position: fixed; z-index: 2; min-width: 232px; max-width: 280px; padding: 6px; border-radius: 14px; animation: none; transform-origin: top left; }
    .chat-menu.closing { animation: none; }
    .chat-menu.opens-up { transform-origin: bottom left; }
    .chat-menu .ctx-menu-item { animation: none; }
    .menu-body { display: flex; flex-direction: column; gap: 2px; }
    .chat-menu-group { display: flex; align-items: center; gap: 12px; height: 32px; padding: 0 10px; font-size: var(--fs-xs); font-weight: 600; color: var(--text-tertiary); letter-spacing: 0.02em; }
    .chat-menu-group .ico { color: var(--text-secondary); }
    .ctx-menu-item.sub { padding-left: 38px; height: 34px; font-weight: 500; }
    .row.menu-open { visibility: hidden; }
    .rail-me[aria-expanded="true"] { box-shadow: none; }
    /* Menus reveal with a clip and a fade; nothing holding text is scaled or moved by fractions, so it never shimmers. */
    @keyframes ctx-in { from { opacity: 0; clip-path: inset(0 0 40% 0 round 12px); } to { opacity: 1; clip-path: inset(0 0 0 0 round 12px); } }
    @keyframes ctx-out { to { opacity: 0; } }
    .ctx-menu { transform: translateZ(0); backface-visibility: hidden; }
    .ctx-menu .ctx-menu-item { animation: none; }
    .ctx-menu-item { display: flex; align-items: center; gap: 12px; width: 100%; height: 36px; padding: 0 10px; border: 0; border-radius: var(--r-xs); background: transparent; color: var(--text-primary); font-size: var(--fs-md); font-weight: 500; text-align: left; }
    .ctx-menu-item:hover, .ctx-menu-item:focus-visible { background: var(--hover); outline: none; }
    .ctx-menu-item.danger { color: var(--danger); }
    .ctx-menu-sep { height: 1px; margin: 3px 8px; border: 0; background: var(--separator); }
    .ctx-menu-header { display: flex; align-items: center; gap: 10px; padding: 8px 10px 10px; margin-bottom: 3px; border-bottom: 1px solid var(--separator); }
    .ctx-menu-who { display: flex; flex-direction: column; min-width: 0; }
    .ctx-menu-who strong { font-size: var(--fs-md); font-weight: 600; }
    .ctx-menu-who span { font-size: var(--fs-xs); color: var(--text-secondary); }
    .reaction-picker { display: flex; align-items: center; gap: 2px; padding: 4px 4px 8px; margin-bottom: 3px; border-bottom: 1px solid var(--separator); }
    .reaction-pick { width: 30px; height: 30px; display: grid; place-items: center; border: 0; border-radius: var(--r-full); background: transparent; font-size: 21px; line-height: 1; transition: transform 0.08s var(--ease); animation: pick-in 0.2s ease-out both; animation-delay: calc(40ms + var(--i, 0) * 18ms); }
    @keyframes pick-in { from { opacity: 0; } }
    .reaction-pick:hover { transform: scale(1.18); }
    .reaction-pick.selected { background: var(--accent-soft); }

    /* ---------------------------------------------------- modals, sheets --- */
    .scrim { position: fixed; inset: 0; z-index: 60; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 20px; animation: fade-in 0.15s ease; }
    @keyframes fade-in { from { opacity: 0; } }
    /* Dialogs: 260 ms, y 12 → 0, scale .98 → 1; a bottom sheet on phones (Motion — My QR code). */
    .modal { position: relative; width: min(420px, 100%); background: var(--surface-2); border: 1px solid var(--separator); border-radius: var(--r-lg); box-shadow: var(--shadow-md); padding: 20px; animation: modal-in 0.26s var(--ease) both; }
    .modal-content { display: flex; flex-direction: column; gap: 12px; }
    .modal.is-morphing { overflow: hidden; }
    .modal-ghost { position: absolute; top: 0; left: 0; padding: 20px; pointer-events: none; }
    @keyframes modal-in { from { opacity: 0; transform: translateY(12px) scale(0.98); } }
    .dialog-head { display: flex; align-items: center; justify-content: space-between; margin: -6px -8px 0 0; }
    .dialog-head .icon-btn { width: 32px; height: 32px; }
    .modal-wide { width: min(520px, 100%); }
    .btn:disabled { opacity: 0.45; cursor: default; }
    .lookup { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 12px 0 14px; border-radius: var(--r-md); background: var(--surface-1); border: 1px solid var(--separator); color: var(--text-tertiary); transition: border-color 0.15s ease; }
    .lookup:focus-within { border-color: var(--accent); }
    .lookup input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; color: var(--text-primary); font: inherit; font-size: var(--fs-base); }
    .lookup input::placeholder { color: var(--text-tertiary); }
    .lookup-result { min-height: 64px; display: flex; align-items: center; }
    .lookup-hint, .lookup-none { margin: 0; font-size: var(--fs-sm); line-height: 1.5; color: var(--text-secondary); text-wrap: pretty; }
    .lookup-none b { font-weight: 600; color: var(--text-primary); }
    .lookup-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 6px 2px; animation: part-in 0.22s var(--ease) both; }
    .lookup-lines { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .lookup-lines strong { font-size: var(--fs-base); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lookup-lines small { font-size: var(--fs-sm); color: var(--text-secondary); display: flex; align-items: center; gap: 4px; }
    .lookup-lines small .ico { color: var(--accent-text); }
    .lookup-status { font-size: var(--fs-xs); color: var(--text-tertiary); white-space: nowrap; }
    .skeleton { display: block; border-radius: var(--r-xs); background: linear-gradient(90deg, var(--hover), var(--pressed), var(--hover)); background-size: 200% 100%; animation: skeleton-sweep 1.4s ease-in-out infinite; }
    .avatar.skeleton { background-image: none; background: var(--hover); border-radius: var(--r-full); animation: none; }
    .lookup-lines i.skeleton { height: 11px; }
    @keyframes skeleton-sweep { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    .dialog-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 4px; padding-top: 14px; border-top: 1px solid var(--separator); }
    .dialog-foot .btn { height: 40px; gap: 8px; }
    /* My QR code: the code on a white tile beside the identity it carries. One object, read left to right. */
    .qr-layout { display: flex; gap: 22px; align-items: flex-start; padding: 6px 0 4px; }
    .qr-side { display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
    .qr-tile { position: relative; width: 196px; padding: 12px; border-radius: 12px; background: #fff; border: 1px solid var(--separator); overflow: hidden; transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease); }
    :root[data-theme="dark"] .qr-tile { border-color: transparent; }
    @media (hover: hover) { .qr-tile:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(0, 0, 0, 0.3); } }
    .qr-tile .qr { display: block; width: 172px; height: 172px; }
    .qr-caption { font-size: var(--fs-xs); color: var(--text-tertiary); padding-left: 2px; }
    .qr .qm { fill: #0b0b12; } .qr .qf { fill: #5e5ce6; }
    /* Reveal: the mark pops first, then the modules in rings around it, 380 ms each. */
    .qr .qm, .qr .qf { transform-box: fill-box; transform-origin: center; animation: qr-ring 0.38s var(--ease) both; animation-delay: calc(var(--qr-wait, 0ms) + 160ms + var(--r, 0) * 40ms); }
    @keyframes qr-ring { from { opacity: 0; transform: scale(0.6); } }
    .qr-mark { overflow: visible; transform-box: fill-box; transform-origin: center; animation: mark-pop 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay: var(--qr-wait, 0ms); }
    @keyframes mark-pop { from { opacity: 0; transform: scale(0.4); } }
    /* Then a soft accent band crosses the code twice and stops. */
    .qr-sweep { position: absolute; left: 0; right: 0; top: 0; height: 36%; pointer-events: none; background: linear-gradient(180deg, transparent, color-mix(in srgb, #5e5ce6 26%, transparent) 50%, transparent); transform: translateY(-110%); animation: qr-sweep 1.6s ease-in-out 2 both; animation-delay: calc(var(--qr-wait, 0ms) + 0.9s); }
    @keyframes qr-sweep { to { transform: translateY(300%); } }
    .qr-who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .qr-name { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; }
    .qr-name span { display: flex; flex-direction: column; min-width: 0; }

    /* ---------------------------------------------------------------- calls -- */

    }

    let shellChat = null, lastHead = "", lastSearch = "", lastCompose = "";

    function renderHead(c) {

    /* The search bar unfolds from its button: the row grows into place, the bar reveals from the

    function searchMorph(open) {
      const slot = $("#thread .search-slot"); const wrap = $(".search-wrap", slot); if (!wrap) return;
      const btn = $('#thread [data-act="search"]'); const btnIcon = $("svg", btn);
      const bar = $(".thread-search", wrap); const glyph = $(":scope > .ico", bar); const input = $("#chat-search", wrap);
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      } else {

      }

    /* Rows are keyed by message id. A row whose markup is unchanged is left alone, so playback,

    function renderMessages(c, keepScroll, animateNew) {

      const items = [];

    function renderSettings() {

        <div class="set-group">${row("qr", "Invite", `Share code ${INVITE_CODE}`, `<button class="btn text" data-act="my-qr">Show QR code</button>`)}</div>

      else if (s === "data") body = `<h2>Data and storage</h2><p>Media is held encrypted in this browser until you clear it.</p>
        <div class="set-group">${row("database", "Cached media", state.cacheCleared ? "0 B" : "412 MB", `<button class="btn text" data-act="clear-cache">Clear</button>`)}${row("image", "Download media", "Automatically on Wi‑Fi", sw("autoMedia", state.autoMedia !== false))}</div>`;
      else body = `<h2>Server</h2><p>The relay this client talks to. It only ever sees ciphertext.</p>

      v.innerHTML = `<header class="thread-head"><button class="icon-btn back-mobile" data-act="back" aria-label="Back to settings">${icon("back")}</button><div class="thread-peer"><strong><span>Settings</span></strong></div></header><div class="set-body">${body}</div>`;

    function renderAll(keepScroll) {
      badges();
      renderPane();
      const inSettings = state.tab === "settings";
      $("#thread").classList.toggle("hidden", inSettings);
      $("#set-view").classList.toggle("hidden", !inSettings);
      if (inSettings) renderSettings(); else renderThread(keepScroll);
      const mobile = window.matchMedia("(max-width: 900px)").matches;
      $("#pane").classList.toggle("hidden-mobile", mobile && !state.mobileList);
      $("#thread").classList.toggle("hidden-mobile", mobile && state.mobileList);
      $("#set-view").classList.toggle("hidden-mobile", mobile && state.mobileList);

    /* ---------------------------------------------------------- actions -- */
    function toast(text, ms = 2200) { $$(".toast").forEach((t) => t.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = text; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
    function closeLayer() {
      const layer = $("#layer");
      $$(".chat-menu-layer:not(.closing)", layer).forEach((w) => { w.classList.add("closing"); closeChatMenu(w); });
      $$(".ctx-menu:not(.closing)", layer).forEach((m) => { if (m.closest(".chat-menu-layer")) return; m.classList.add("closing"); if (m.classList.contains("account-menu")) closeAccountMenu(m); else setTimeout(() => m.remove(), 140); });

    function modal(html, cls = "modal") { closeLayer(); $("#layer").innerHTML = `<div class="scrim" data-act="close-layer"><div class="${cls}" role="dialog" aria-modal="true"><div class="modal-content">${html}</div></div></div>`; focusFirst(); }
    function focusFirst() { const f = $(".modal [autofocus]"); if (f) f.focus(); }
    /* One dialog becomes another: the box stays where it is and grows or shrinks to the new
       content, the old content fades out, the new one settles in. A QR code inside waits for the
       box to stop before it reveals. */
    const EASE_OUT = "cubic-bezier(0.16, 1, 0.3, 1)";
    function morphDialog(html, cls = "modal") {
      const el = $(".modal");
      if (!el || window.matchMedia("(prefers-reduced-motion: reduce)").matches) { if (el) { el.className = cls; el.innerHTML = `<div class="modal-content">${html}</div>`; focusFirst(); } else modal(html, cls); return; }
      const from = el.getBoundingClientRect();
      const old = $(".modal-content", el);
      const ghost = document.createElement("div"); ghost.className = "modal-ghost"; ghost.style.width = from.width + "px"; ghost.appendChild(old);
      el.className = cls + " is-morphing";
      const fresh = document.createElement("div"); fresh.className = "modal-content"; fresh.innerHTML = html;
      el.appendChild(fresh); el.appendChild(ghost);
      const to = el.getBoundingClientRect();
      const pad = parseFloat(getComputedStyle(el).paddingLeft) * 2 + 2;
      fresh.style.width = (to.width - pad) + "px";
      $$(".qr-tile", fresh).forEach((t) => t.style.setProperty("--qr-wait", "300ms"));
      el.animate([{ width: from.width + "px", height: from.height + "px" }, { width: to.width + "px", height: to.height + "px" }], { duration: 400, easing: EASE_OUT }).onfinish = () => { el.classList.remove("is-morphing"); fresh.style.width = ""; ghost.remove(); focusFirst(); };
      ghost.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 140, easing: "ease-out", fill: "forwards" });
      fresh.animate([{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }], { duration: 280, delay: 120, easing: EASE_OUT, fill: "backwards" });
    }

    function openChat(id) { state.chatId = id; state.replyTo = null; state.searchOpen = false; state.query = ""; state.mobileList = false; const c = chat(); c.unread = 0; c.newReactions = false; renderAll(); }
    function onDraft() { const f = $("#field"); if (!f) return; const c = chat(); if (c) c.draft = f.value; $("#compose").classList.toggle("has-draft", f.value.trim().length > 0); if (!f.value) { f.style.height = ""; return; } f.style.height = "auto"; f.style.height = Math.min(160, f.scrollHeight) + "px"; }
    function onScroll() { updateJump(); }
    function updateJump() {
      const sc = $("#thread .messages"); if (!sc) return;
      const away = sc.scrollHeight - sc.scrollTop - sc.clientHeight > 240;
      let j = $("#thread .jump-latest");
      if (away && !j) { j = document.createElement("button"); j.className = "jump-latest"; j.dataset.act = "jump-latest"; j.innerHTML = `${icon("arrow-down", "ico-14")}Latest${state.unseenBelow ? `<span class="count">${state.unseenBelow}</span>` : ""}`; $("#thread").appendChild(j); }
      if (!away) { state.unseenBelow = 0; if (j) j.remove(); } else if (j) { const cnt = $(".count", j); if (state.unseenBelow) { if (cnt) cnt.textContent = state.unseenBelow; else j.insertAdjacentHTML("beforeend", `<span class="count">${state.unseenBelow}</span>`); } }
    }

    function deliver(m) {
      setTimeout(() => { m.status = "sent"; renderAll(true); }, 500 + Math.random() * 500);
      const c = chat();
      setTimeout(() => { if (c.online) { m.status = "read"; renderAll(true); } }, 1400 + Math.random() * 800);
    }
    function simulateReply(c) {
      if (!c.online || c.replyTimer) return;
      c.replyTimer = setTimeout(() => {
        c.typing = true; renderAll(true);
        setTimeout(() => {
          c.typing = false; c.replyTimer = null;
          const text = c.replies[(c.replyIndex = ((c.replyIndex || 0) + 1) % c.replies.length)];
          const m = msg({ text, time: now(), status: "read" });
          c.messages.push(m);
          if (state.chatId !== c.id) { c.unread++; if (state.notifications) toast(`${c.name}: ${text}`); }
          else { const sc = $("#thread .messages"); if (sc && sc.scrollHeight - sc.scrollTop - sc.clientHeight > 240) state.unseenBelow++; }
          renderAll(true);

      }, 900 + Math.random() * 900);
    }
    const text_len = (c) => (c.replies[((c.replyIndex || 0) + 1) % c.replies.length] || "").length;

    function send(extra) {

      const m = msg(Object.assign({ mine: true, text, time: now(), status: "pending", replyTo: state.replyTo }, extra || {}));

    }

    function openMenu(x, y, items, header = "") {
      closeLayer();

      menu.innerHTML = header + items.map((it) => it === "-" ? `<hr class="ctx-menu-sep" />` : `<button class="ctx-menu-item ${it.danger ? "danger" : ""}" role="menuitem" data-menu="${it.id}" ${it.data ? `data-id="${it.data}"` : ""}>${icon(it.icon, "ico-16")}${it.label}</button>`).join("");

      menu.style.top = Math.round(Math.max(8, flipY ? y - r.height : y)) + "px";

    }
    function messageMenu(m, x, y, row) {
      const c = chat();
      row.classList.add("menu-open");
      const picker = `<div class="reaction-picker">${QUICK.map((e) => `<button class="reaction-pick ${m.reactions[e]?.includes("me") ? "selected" : ""}" data-react="${e}" aria-label="React ${e}">${e}</button>`).join("")}<button class="reaction-pick" data-menu="more-reactions" aria-label="More reactions" style="font-size:14px;background:var(--hover);width:26px;height:26px">${icon("more", "ico-14")}</button></div>`;
      const items = m.deleted ? [{ id: "delete", icon: "trash", label: "Delete for me", danger: true }] : [
        { id: "reply", icon: "reply", label: "Reply" },

        ...(m.link ? [{ id: "copy-link", icon: "copy", label: "Copy link" }] : []),

      const menu = openMenu(x, y, items, m.deleted ? "" : picker);
      menu.dataset.msg = m.id;
    }
    function toggleReaction(m, e, who = "me") {
      m.reactions[e] = m.reactions[e] || [];
      const i = m.reactions[e].indexOf(who);
      if (i >= 0) m.reactions[e].splice(i, 1); else { if (who === "me") for (const k of Object.keys(m.reactions)) m.reactions[k] = m.reactions[k].filter((w) => w !== "me"); m.reactions[e].push(who); }
      renderAll(true);
      if (i < 0 && who === "me" && !m.mine && chat().online && Math.random() < 0.5) setTimeout(() => { const mm = chat().messages.find((x) => x.mine); if (mm) { toggleReaction(mm, e === "👍" ? "❤️" : "👍", chat().id); } }, 1800);
    }
    function jumpTo(id) { const row = $(`[data-msg="${id}"]`); if (!row) { toast("That message is no longer here"); return; } row.scrollIntoView({ block: "center", behavior: "smooth" }); row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash"); }
    function jumpToMatch() {
      const c = chat(); const ids = c.messages.filter((m) => (m.text || "").toLowerCase().includes(state.query.toLowerCase())).map((m) => m.id);
      if (!ids.length) return; const pos = ((state.searchPos || 1) - 1 + ids.length) % ids.length; const row = $(`[data-msg="${ids[ids.length - 1 - pos]}"]`); if (row) row.scrollIntoView({ block: "center" });
    }

    let playTimer = null;
    function patchVoice(m) {
      const btn = $(`[data-play="${m.id}"]`); const wave = $(`[data-seek="${m.id}"]`);
      if (!btn || !wave) { renderAll(true); return; }
      btn.innerHTML = m.playing ? icon("pause") : icon("play", "play");
      btn.setAttribute("aria-label", `${m.playing ? "Pause" : "Play"} voice message`);
      const p = m.played || 0;
      Array.from(wave.children).forEach((bar, i) => bar.classList.toggle("played", i / 30 < p));
      const t = wave.parentElement.querySelector(".voice-foot > span:first-child");
      if (t) t.textContent = `${p ? dur(p * m.duration) + " / " : ""}${dur(m.duration)}`;
      const dot = wave.parentElement.querySelector(".voice-foot .dot"); if (dot && p) dot.remove();
    }
    function togglePlay(m) {
      const c = chat();
      if (m.playing) { m.playing = false; clearInterval(playTimer); playTimer = null; patchVoice(m); return; }
      c.messages.forEach((x) => { if (x.playing) { x.playing = false; patchVoice(x); } }); clearInterval(playTimer);
      m.playing = true; m.played = m.played >= 0.999 ? 0 : m.played || 0; patchVoice(m);
      playTimer = setInterval(() => { m.played = Math.min(1, (m.played || 0) + 0.25 / m.duration); if (m.played >= 1) { m.playing = false; clearInterval(playTimer); playTimer = null; } patchVoice(m); }, 250);
    }

    /* Recording takes the text field's place: bin, a capsule with the clock and a live wave, send.
       The wave is simulated: a level every 100 ms, old bars dropped once the track is full. */
    let rec = null;
    function startRecording() {
      if (rec) return;
      const form = $("#compose"); form.removeAttribute("data-close"); form.classList.add("recording");
      const track = $("#rec-wave .rec-wave-track"); track.innerHTML = "";
      let level = 0.3;
      rec = { start: Date.now(), timer: setInterval(() => {
        const s = Math.floor((Date.now() - rec.start) / 1000); const t = $("#rec-time"); if (t) t.textContent = dur(s);
      }, 200), wave: setInterval(() => {
        level = Math.max(0.08, Math.min(1, level + (Math.random() - 0.5) * 0.5));
        const bar = document.createElement("i"); bar.style.height = `${4 + level * 18}px`; track.appendChild(bar);
        const wave = $("#rec-wave"); const fit = Math.floor(wave.clientWidth / 5);
        while (track.children.length > fit) track.firstChild.remove();
        wave.classList.toggle("scrolling", track.children.length >= fit);
      }, 100) };
    }
    function stopRecording(sendIt) {
      if (!rec) return;
      const secs = Math.max(1, Math.round((Date.now() - rec.start) / 1000)); clearInterval(rec.timer); clearInterval(rec.wave); rec = null;
      const form = $("#compose"); form.dataset.close = sendIt ? "send" : "discard";
      setTimeout(() => { form.classList.remove("recording"); form.removeAttribute("data-close"); if (sendIt) send({ type: "voice", duration: secs, text: "" }); else toast("Recording discarded"); }, sendIt ? 220 : 420);
    }

    /* Calls: an always-dark stage. Encryption badge top-left (amber "Not verified" opens the
       safety number), minimise top-right, the face with breathing rings while it rings, name,
       clock and a live mic meter, and a dock of labelled round controls. Video opens out of
       the face as a growing circle. Minimised, the call is a green pill over the chat list. */
    let call = null;
    const callClock = () => dur(call.secs).padStart(5, "0");
    function callStageHtml() {
      const c = call.c, connected = call.phase === "connected";
      const status = call.phase === "calling" ? "Calling…" : call.phase === "ringing" ? "Ringing…" : `<span class="call-clock">${callClock()}</span>`;
      const meter = connected && !call.muted ? `<span class="mic-meter" aria-label="Your microphone"><i></i><i></i><i></i><i></i><i></i></span>` : "";
      const badge = c.verified ? `<button class="call-badge" data-call="safety">${icon("shield", "ico-14")}End-to-end encrypted</button>` : `<button class="call-badge warn" data-call="safety">${icon("shield", "ico-14")}Not verified</button>`;
      const video = call.kind === "video" && connected && call.remoteCam !== false;
      return `
        <div class="call-top">${badge}<span class="call-safety hidden" id="call-safety"></span><button class="icon-btn call-min" data-call="minimize" aria-label="Minimise call" title="Minimise">${icon("down", "ico-18")}</button></div>
        ${video ? `<div class="call-remote ${call.fit}" aria-label="${esc(c.name)}’s camera"><div class="call-remote-pic"></div></div>
        <div class="call-topbar"><strong>${esc(c.name)}</strong><span class="call-clock">${callClock()}</span>${meter}</div>
        ${call.cam ? `<div class="call-self" aria-label="Your camera"><span>You</span></div>` : ""}` : `
        <div class="call-centre">
          <div class="call-face ${connected ? "" : "ringing"}">${avatar(c, "avatar-xl")}<i class="ring"></i><i class="ring"></i></div>
          <strong class="call-name">${esc(c.name)}</strong>
          <span class="call-status">${status}</span>
          ${meter}
        </div>`}
        <div class="call-dock" role="group" aria-label="Call controls">
          <button class="dock-btn ${call.muted ? "on" : ""}" data-call="mute" aria-pressed="${call.muted}"><span>${icon(call.muted ? "mic-off" : "mic")}</span>${call.muted ? "Unmute" : "Mute"}</button>
          <button class="dock-btn ${call.cam ? "on" : ""}" data-call="cam" aria-pressed="${call.cam}"><span>${icon(call.cam ? "video" : "video-off")}</span>Video</button>
          ${video ? `<button class="dock-btn" data-call="fit"><span>${icon("monitor")}</span>${call.fit === "contain" ? "Fill" : "Center"}</button>` : ""}
          <button class="dock-btn end" data-call="end"><span>${icon("phone-off")}</span>End</button>
        </div>`;
    }
    function paintCall() { if (!call?.el) return; const panel = $("#call-safety"); const open = panel ? !panel.classList.contains("hidden") : false; call.el.innerHTML = callStageHtml(); if (open) toggleSafety(true); }
    function paintClock() { $$(".call-clock").forEach((n) => { n.textContent = callClock(); }); }
    function startCall(kind) {
      if (call) { expandCall(); return; }
      const c = chat(); closeLayer();
      call = { c, kind, phase: "calling", secs: 0, muted: false, cam: kind === "video", fit: "contain", minimized: false, timers: [] };
      const el = document.createElement("div"); el.className = "call"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", `${kind} call with ${c.name}`);
      call.el = el; $("#layer").appendChild(el); paintCall();

      el.addEventListener("click", onCallClick);

      call.timers.push(setTimeout(() => { call.phase = "connected"; if (call.kind === "video") revealVideo(); else paintCall(); }, 3200));
      call.tick = setInterval(() => { if (call && call.phase === "connected") { call.secs++; paintClock(); } }, 1000);
    }
    /* Their picture opens out of their face as a growing circle. */
    function revealVideo() {
      const face = $(".call-face .avatar", call.el); const r = face ? face.getBoundingClientRect() : null;
      paintCall();

        case "profile": modal(`<h2>Profile</h2><div class="sheet-head">${avatar(me, "avatar-lg")}<strong>${esc(me.name)}</strong><span>@${esc(me.username)}</span></div><label style="font-size:13px;color:var(--text-secondary)">Display name<input class="field" id="profile-name" value="${esc(me.name)}" style="margin-top:6px" /></label><div class="modal-actions"><button class="btn secondary" data-act="close-layer">Cancel</button><button class="btn" data-act="save-profile">Save</button></div>`); break;
        case "save-profile": me.name = $("#profile-name").value.trim() || me.name; closeLayer(); renderAll(true); toast("Profile saved"); break;
      }
    });

    document.addEventListener("contextmenu", (e) => {
      const chatRow = e.target.closest(".row[data-chat]"); if (chatRow) { e.preventDefault(); openChatMenu(chatRow); return; }
      const row = e.target.closest("[data-msg]"); if (!row) return; e.preventDefault(); const m = chat().messages.find((x) => x.id === row.dataset.msg); messageMenu(m, e.clientX, e.clientY, row);
    });
    document.addEventListener("input", (e) => {
      if (e.target.id === "pane-search") { state.filter = e.target.value.toLowerCase(); state.filterFocus = true; renderPane(); state.filterFocus = false; }
      if (e.target.id === "add-username") runLookup(e.target.value);
      if (e.target.id === "dev-pass") { const go = $("[data-act='remove-device-go']"); if (go) go.disabled = !e.target.value; }
      if (e.target.id === "chat-search") { state.query = e.target.value; state.searchPos = 1; renderThread(true); }
      if (e.target.id === "field" && chat()?.online && e.target.value.trim()) { const c = chat(); clearTimeout(c.myTypingTimer); c.myTypingTimer = setTimeout(() => {}, 1000); }
    });
    document.addEventListener("submit", (e) => { if (e.target.id === "compose") { e.preventDefault(); if (rec) stopRecording(true); else send(); } });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && rec && !e.shiftKey) { e.preventDefault(); stopRecording(true); return; }
      if (e.key === "Escape") { if (call && !$("#call-safety")?.classList.contains("hidden")) { toggleSafety(false); return; } if (rec) { stopRecording(false); return; } if ($("#layer").querySelector(":not(.closing)")) { closeLayer(); return; } if (state.searchOpen) { state.searchOpen = false; state.query = ""; renderThread(true); return; } if (state.replyTo) { state.replyTo = null; renderThread(true); } }
      if (e.target.id === "field" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
      if (e.target.id === "dev-name" && e.key === "Enter") { e.preventDefault(); $("#dev-save")?.click(); }
      if (e.target.id === "dev-pass" && e.key === "Enter") { e.preventDefault(); const go = $("[data-act='remove-device-go']"); if (go && !go.disabled) go.click(); }
      if (e.target.id === "add-username" && e.key === "Enter") { e.preventDefault(); const go = $("#lookup-go"); if (go && !go.disabled) go.click(); }
      if (e.target.id === "chat-search" && e.key === "Enter") { e.preventDefault(); state.searchPos = (state.searchPos || 1) + (e.shiftKey ? -1 : 1); if (state.searchPos < 1) state.searchPos = 1; renderThread(true); }
      if (e.key === "ArrowUp" && e.target.id === "field" && !e.target.value) { const mine = [...chat().messages].reverse().find((m) => m.mine && m.type === "text" && !m.deleted); if (mine) { e.target.value = mine.text; onDraft(); } }
    });
    $("#file-picker").addEventListener("change", (e) => { const f = e.target.files[0]; if (!f) return; send({ type: "file", fileName: f.name, fileSize: f.size > 1048576 ? (f.size / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(f.size / 1024)) + " KB", text: "" }); e.target.value = ""; });
    $("#photo-picker").addEventListener("change", (e) => {
      const f = e.target.files[0]; if (!f) return; e.target.value = "";
      const src = URL.createObjectURL(f);
      if (!f.type.startsWith("video/")) { send({ type: "photo", src, text: "" }); return; }
      const probe = document.createElement("video"); probe.preload = "metadata"; probe.src = src;
      probe.onloadedmetadata = () => send({ type: "video", src, duration: Math.max(1, Math.round(probe.duration || 1)), text: "" });
      probe.onerror = () => send({ type: "video", src, duration: 1, text: "" });
    });
    /* The account menu grows out of the rail avatar: the card unfolds from the avatar's circle
       while the avatar itself lifts into the card's header. Closing folds it back the same way. */
    function openAccountMenu() {
      const btn = $("#rail-me"); const src = $(".avatar", btn); const r = src.getBoundingClientRect();
      closeLayer();
      const menu = document.createElement("div"); menu.className = "ctx-menu account-menu"; menu.setAttribute("role", "menu");
      menu.innerHTML = `<div class="acct-head">${avatar(me, "", true)}<span class="acct-head-text"><strong>${esc(me.name)}</strong><span>@${esc(me.username)} · ${devices.length} devices</span></span></div>
        <div class="menu-body">
        <button class="ctx-menu-item" role="menuitem" data-menu="profile">${icon("user", "ico-16")}Profile</button>
        <button class="ctx-menu-item" role="menuitem" data-menu="settings">${icon("settings", "ico-16")}Settings</button>
        <hr class="ctx-menu-sep" />
        <button class="ctx-menu-item danger" role="menuitem" data-menu="logout">${icon("logout", "ico-16")}Log out</button>
        </div>`;
      $("#layer").appendChild(menu);
      const mw = menu.offsetWidth, mh = menu.offsetHeight;
      const left = Math.round(Math.max(8, r.left - 8)), top = Math.round(Math.max(8, r.bottom + 8 - mh));
      menu.style.left = left + "px"; menu.style.top = top + "px";
      btn.setAttribute("aria-expanded", "true");
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const target = $(".acct-head .avatar", menu); const tr = target.getBoundingClientRect();
      const circle = `inset(${r.top - top}px ${left + mw - r.right}px ${top + mh - r.bottom}px ${r.left - left}px round 18px)`;
      menu.__circle = circle; menu.__rail = r;
      if (reduce) return;
      menu.animate([{ clipPath: circle }, { clipPath: "inset(0 0 0 0 round 14px)" }], { duration: 380, easing: EASE_OUT, fill: "both" });
      $$(".acct-head-text, .menu-body", menu).forEach((n, i) => n.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, delay: 150 + i * 60, easing: "ease-out", fill: "backwards" }));
      target.style.opacity = "0"; src.style.opacity = "0";
      const fly = src.cloneNode(true); fly.classList.add("fly-avatar");
      fly.style.cssText = `position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;z-index:71;margin:0;transform-origin:top left;font-size:${getComputedStyle(src).fontSize}`;
      $("#layer").appendChild(fly);
      fly.animate([{ transform: "none" }, { transform: `translate(${tr.left - r.left}px, ${tr.top - r.top}px) scale(${tr.width / r.width})` }], { duration: 380, easing: EASE_OUT, fill: "forwards" }).onfinish = () => { target.style.opacity = ""; fly.remove(); };
    }
    /* A chat's own menu (right-click its row): the row becomes the menu's header where it is,
       and the actions unfold beneath it, or above it when there is no room below. */
    const MUTE_CHOICES = [[3600, "Mute for 1 hour"], [28800, "Mute for 8 hours"], [86400, "Mute for 1 day"], [null, "Mute until I turn it back on"]];
    function openChatMenu(rowEl) {
      const c = chats.find((x) => x.id === rowEl.dataset.chat); if (!c) return;
      closeLayer();
      const r = rowEl.getBoundingClientRect();
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const items = [];
      if (c.unread > 0) items.push(`<button class="ctx-menu-item" role="menuitem" data-menu="read">${icon("check2", "ico-16")}Mark as read</button>`);
      if (c.muted) items.push(`<button class="ctx-menu-item" role="menuitem" data-menu="unmute">${icon("bell", "ico-16")}Unmute</button>`);
      else {
        if (items.length) items.push(`<hr class="ctx-menu-sep" />`);
        items.push(`<div class="chat-menu-group">${icon("bell-off", "ico-16")}Mute</div>`);
        MUTE_CHOICES.forEach(([secs, label]) => items.push(`<button class="ctx-menu-item sub" role="menuitem" data-menu="mute:${secs === null ? "forever" : secs}">${label.replace("Mute ", "").replace(/^f/, "F").replace(/^u/, "U")}</button>`));
      }
      const wrap = document.createElement("div"); wrap.className = "chat-menu-layer"; wrap.dataset.chat = c.id;
      wrap.innerHTML = `<div class="chat-menu-scrim"></div><div class="row chat-menu-row ${rowEl.classList.contains("active") ? "active" : ""} ${rowEl.classList.contains("unread") ? "unread" : ""}">${rowEl.innerHTML}</div><div class="ctx-menu chat-menu" role="menu" data-chat="${c.id}"><div class="menu-body">${items.join("")}</div></div>`;
      $("#layer").appendChild(wrap);
      const lifted = $(".chat-menu-row", wrap), menu = $(".chat-menu", wrap);
      lifted.style.cssText = `left:${Math.round(r.left)}px;top:${Math.round(r.top)}px;width:${Math.round(r.width)}px;height:${Math.round(r.height)}px`;
      const mh = menu.offsetHeight;
      const below = r.bottom + 6 + mh <= window.innerHeight - 8;
      menu.classList.toggle("opens-up", !below);
      menu.style.left = Math.round(r.left) + "px"; menu.style.top = Math.round(below ? r.bottom + 6 : r.top - 6 - mh) + "px";
      rowEl.classList.add("menu-open");
      wrap.__row = rowEl; wrap.__below = below;
      if (reduce) return;
      $(".chat-menu-scrim", wrap).animate([{ opacity: 0 }, { opacity: 1 }], { duration: 180, easing: "ease-out", fill: "both" });
      lifted.animate([{ transform: "translateY(0)", boxShadow: "0 0 0 rgba(0,0,0,0)" }, { transform: "translateY(-2px)", boxShadow: "0 12px 32px rgba(0,0,0,0.35)" }], { duration: 240, easing: EASE_OUT, fill: "both" });
      menu.animate([{ clipPath: below ? "inset(0 0 100% 0 round 14px)" : "inset(100% 0 0 0 round 14px)" }, { clipPath: "inset(0 0 0 0 round 14px)" }], { duration: 320, delay: 40, easing: EASE_OUT, fill: "both" });
      $(".menu-body", menu).animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, delay: 120, easing: "ease-out", fill: "backwards" });
    }
    function closeChatMenu(wrap) {
      const done = () => { wrap.remove(); wrap.__row?.classList.remove("menu-open"); };
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { done(); return; }
      const below = wrap.__below, menu = $(".chat-menu", wrap), lifted = $(".chat-menu-row", wrap);
      $(".menu-body", menu).animate([{ opacity: 1 }, { opacity: 0 }], { duration: 100, easing: "ease-out", fill: "forwards" });
      menu.animate([{ clipPath: "inset(0 0 0 0 round 14px)" }, { clipPath: below ? "inset(0 0 100% 0 round 14px)" : "inset(100% 0 0 0 round 14px)" }], { duration: 220, easing: EASE_OUT, fill: "forwards" });
      lifted.animate([{ transform: "translateY(-2px)", boxShadow: "0 12px 32px rgba(0,0,0,0.35)" }, { transform: "translateY(0)", boxShadow: "0 0 0 rgba(0,0,0,0)" }], { duration: 220, delay: 40, easing: EASE_OUT, fill: "forwards" });
      $(".chat-menu-scrim", wrap).animate([{ opacity: 1 }, { opacity: 0 }], { duration: 220, delay: 40, easing: "ease-out", fill: "forwards" }).onfinish = done;
    }
    function chatMenuAction(c, id) {
      if (id === "read") { c.unread = 0; toast("Marked as read"); }
      else if (id === "unmute") { c.muted = false; toast(`${c.name} unmuted`); }
      else if (id.startsWith("mute:")) { c.muted = true; const secs = id.slice(5); const label = MUTE_CHOICES.find(([v]) => String(v === null ? "forever" : v) === secs)?.[1] || "Muted"; toast(`${c.name} · ${label.replace("Mute", "muted")}`); }
      renderAll(true);
    }
    function closeAccountMenu(menu) {
      const btn = $("#rail-me"); const src = $(".avatar", btn); btn.setAttribute("aria-expanded", "false");
      const done = () => { menu.remove(); src.style.opacity = ""; };
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { done(); return; }
      const target = $(".acct-head .avatar", menu); const tr = target.getBoundingClientRect(); const r = menu.__rail;
      target.style.opacity = "0";
      const fly = target.cloneNode(true); fly.classList.add("fly-avatar");
      fly.style.cssText = `position:fixed;left:${tr.left}px;top:${tr.top}px;width:${tr.width}px;height:${tr.height}px;z-index:71;margin:0;opacity:1;transform-origin:top left;font-size:${getComputedStyle(target).fontSize}`;
      $("#layer").appendChild(fly);
      fly.animate([{ transform: "none" }, { transform: `translate(${r.left - tr.left}px, ${r.top - tr.top}px) scale(${r.width / tr.width})` }], { duration: 300, easing: EASE_OUT, fill: "forwards" }).onfinish = () => { fly.remove(); src.style.opacity = ""; };
      $$(".acct-head-text, .menu-body", menu).forEach((n) => n.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 110, easing: "ease-out", fill: "forwards" }));
      menu.animate([{ clipPath: "inset(0 0 0 0 round 14px)" }, { clipPath: menu.__circle }], { duration: 300, easing: EASE_OUT, fill: "forwards" }).onfinish = done;
    }
    $("#rail-me").addEventListener("click", (e) => {
      e.stopPropagation();
      if ($("#rail-me").getAttribute("aria-expanded") === "true") { closeLayer(); return; }
      openAccountMenu();
    });
    function syncProposal() { $$(".proposal .seg").forEach((s) => { const cur = document.documentElement.getAttribute(s.dataset.attr) || (s.dataset.attr === "data-out" ? "tinted" : "dark"); $$("button", s).forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.value === cur))); }); if (state.tab === "settings") renderSettings(); }
    window.addEventListener("resize", () => { if (window.matchMedia("(max-width: 900px)").matches && !state.wasMobile) { state.wasMobile = true; state.mobileList = true; } renderAll(true); });

    /* --------------------------------------------------- the first minute -- */
    document.documentElement.setAttribute("data-theme", window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    document.documentElement.setAttribute("data-out", "tinted");
    state.mobileList = state.wasMobile = window.matchMedia("(max-width: 900px)").matches;
    syncProposal();
    renderAll();
    const mara = chats[0];
    setTimeout(() => { mara.typing = true; renderAll(true); }, 1500);
    setTimeout(() => { mara.typing = false; mara.messages.push(msg({ text: "Almost there, 2 min", time: now() })); if (state.chatId !== "mara") mara.unread++; mara.replyIndex = 0; renderAll(true); }, 4200);
    setTimeout(() => { const j = chats.find((c) => c.id === "jonas"); j.online = true; j.messages.push(msg({ text: "Are you around later?", time: now() })); if (state.chatId !== "jonas") { j.unread++; if (state.notifications) toast("Jonas Reinholt: Are you around later?"); } renderAll(true); }, 26000);
  })();
  </script>
</body>
</html>
