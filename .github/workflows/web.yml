name: Web

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

jobs:
  test:
    name: typecheck / selftests / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Install scripts only fetch onnxruntime-node's native binary, which the browser build never uses.
      - name: npm ci
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Selftests
        run: npm test

      - name: Build
        run: npm run build
