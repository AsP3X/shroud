name: Android

# The one Google-free build (decision record 2026-10-01; android-port plan §2.0 rule 6, §5.2):
# unit tests, lint, the ground-rule checks and a minified release, then a look inside the APK.

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    name: unit tests / lint / Google-free release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      # gradle/gradle-daemon-jvm.properties pins the daemon to JDK 21 (no download URLs).
      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Caches dependencies and validates the wrapper checksum.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint, no Material, no Google services, release build
        run: >-
          ./gradlew --no-daemon --continue
          :app:testDebugUnitTest
          :app:lintDebug
          :app:verifyNoMaterial
          :app:verifyNoGoogleServices
          :app:assembleRelease
          :app:verifyNoGoogleClasses

      # verifyNoGoogleClasses above checks R8's mapping by original class name: R8 moves most
      # renamed classes into the unnamed package, so this dex listing only sees kept names. The
      # prefixes are bannedGoogleGroups in app/build.gradle.kts.
      - name: No Google packages or GMS entries in the release APK
        run: |
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          analyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          "$analyzer" dex packages "$apk" > "$RUNNER_TEMP/dex-packages.txt"
          if grep -E '[[:space:]](com\.google\.(firebase|android\.gms|gms|mlkit|crypto\.tink|android\.play|android\.datatransport)|com\.android\.installreferrer)([.[:space:]]|$)' "$RUNNER_TEMP/dex-packages.txt"; then
            echo "::error::the release APK contains Google services classes"
            exit 1
          fi
          "$analyzer" manifest print "$apk" > "$RUNNER_TEMP/manifest.xml"
          if grep -E 'com\.google\.android\.gms|com\.google\.android\.c2dm|com\.google\.firebase' "$RUNNER_TEMP/manifest.xml"; then
            echo "::error::the release manifest mentions Google services"
            exit 1
          fi

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 7
