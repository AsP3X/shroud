name: Admin UI

on:
  push:
    paths:
      - "admin/ui/**"
      - ".github/workflows/admin-ui.yml"
  pull_request:
    paths:
      - "admin/ui/**"
      - ".github/workflows/admin-ui.yml"

# The jobs only read the repository.
permissions:
  contents: read

jobs:
  build:
    name: typecheck / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin/ui

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The Node major admin/Dockerfile builds the console with.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/ui/package-lock.json

      - name: npm ci
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
