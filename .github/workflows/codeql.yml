name: CodeQL

# GitHub's default setup scanned only master, the default branch. This workflow replaces it and only
# uploads once the repository's code scanning is switched to advanced setup: while default setup is
# on, GitHub rejects the upload of the analyze step.
# Every pushed branch is scanned, so dev and a feature branch show their own findings.
#
# Swift is not scanned yet. The app needs Xcode 27 (the iOS 27 SDK), whose compiler and macro
# plugin server are arm64 only, while CodeQL's Swift extractor runs the build under Rosetta and
# supports Swift up to 6.3, so every @Observable fails to expand in the traced build.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master]
  schedule:
    # New queries reach code that did not change. GitHub runs schedules on the default branch.
    - cron: "23 4 * * 1"

# The jobs only read the repository; analyze needs security-events: write to upload.
permissions:
  contents: read

# A newer push to the same ref supersedes a running scan.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # The languages default setup scanned.
          - language: actions
            build-mode: none
            runner: ubuntu-latest
          - language: c-cpp
            build-mode: none
            runner: ubuntu-latest
          - language: java-kotlin
            build-mode: manual
            runner: ubuntu-latest
          - language: javascript-typescript
            build-mode: none
            runner: ubuntu-latest
          - language: python
            build-mode: none
            runner: ubuntu-latest
          - language: rust
            build-mode: none
            runner: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      # Kotlin is only extracted from a traced compile. Only the app's sources are compiled, so the
      # vendored whisper.cpp native build does not run.
      - name: Build Android sources
        if: matrix.language == 'java-kotlin'
        working-directory: android
        run: ./gradlew :app:compileDebugSources --no-daemon --no-build-cache --no-configuration-cache -Pkotlin.compiler.execution.strategy=in-process

      # The category default setup used, so its alerts carry over and the excluded ones close.
      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
