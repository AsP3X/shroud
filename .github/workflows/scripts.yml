name: Scripts

on:
  push:
    paths:
      - "**.ps1"
      - "**.sh"
      - "**.sql"
      - "**.conf"
      - "**.template"
      - "**Dockerfile"
      - "**.dockerignore"
      - "docker-compose*.yml"
      - "server/**"
      - "web/**"
      - "admin/**"
      - ".gitattributes"
      - ".github/workflows/scripts.yml"
  pull_request:
    paths:
      - "**.ps1"
      - "**.sh"
      - "**.sql"
      - "**.conf"
      - "**.template"
      - "**Dockerfile"
      - "**.dockerignore"
      - "docker-compose*.yml"
      - "server/**"
      - "web/**"
      - "admin/**"
      - ".gitattributes"
      - ".github/workflows/scripts.yml"

# The jobs only read the repository.
permissions:
  contents: read

jobs:
  ps1-ascii:
    name: PowerShell scripts are ASCII
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Windows PowerShell 5.1 reads a .ps1 without a BOM as Windows-1252, so a UTF-8 character
      # such as an em dash can turn into a closing quote and break parsing of the rest of the file.
      - name: No non-ASCII byte in a .ps1 file
        run: |
          if LC_ALL=C git grep -nP '[^\x00-\x7F]' -- '*.ps1'; then
            echo "::error::The lines above contain non-ASCII characters. Windows PowerShell 5.1 cannot parse them; use ASCII only."
            exit 1
          fi

  setup-wizard:
    name: The Windows setup wizard keeps a second stack's .env settings
    # Windows PowerShell 5.1, which deploy.ps1 and setup.ps1 must run in.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: A re-run of scripts/setup.ps1 keeps COMPOSE_PROJECT_NAME, the host ports and extras
        shell: powershell
        run: ./scripts/test-setup-wizard.ps1

  lf-line-endings:
    name: Text files have LF line endings
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The Linux images run the shell scripts, SQL, nginx templates and Compose files as they are
      # committed: a CR at a line end breaks them (`set: Illegal option -`). .gitattributes makes
      # git store LF; this catches a CR that reaches a commit around it. It reads the index, so it
      # checks the committed bytes, not the runner's checkout. -I skips binary files; batch files
      # need CRLF and .pen files are Pen.app's own bytes.
      - name: No CR byte in a committed text file
        run: |
          rc=0
          git grep --cached -nI $'\r' -- . ':(exclude)*.bat' ':(exclude)*.cmd' ':(exclude)*.pen' || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::The lines above end with CR. Commit them with LF line endings (see .gitattributes)."
            exit 1
          elif [ "$rc" -ne 1 ]; then
            echo "::error::git grep failed with exit code $rc."
            exit "$rc"
          fi

      # A CRLF checkout on Windows comes from the attributes, not from the committed bytes, so the
      # step above would stay green if .gitattributes lost eol=lf. This one fails then.
      - name: Files the Linux images read check out with LF
        run: |
          files=$(git ls-files -- '*.sh' '*.sql' '*.conf' '*.template' '*Dockerfile' '*.dockerignore' 'docker-compose*.yml')
          if [ -z "$files" ]; then
            echo "::error::No container files found; the pathspecs above are out of date."
            exit 1
          fi
          wrong=$(printf '%s\n' "$files" | git check-attr --cached --stdin eol | grep -v ': eol: lf$' || true)
          if [ -n "$wrong" ]; then
            printf '%s\n' "$wrong"
            echo "::error::These files would check out with CRLF on Windows. .gitattributes must give them eol=lf."
            exit 1
          fi
